<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Single Feeder MAX Data</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.4/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.17/jspdf.plugin.autotable.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="newdataCSS.css">

</head>
<body>
  <div class="header">
    <div class="header-content">
      <img src="logo_new.png" alt="Logo" width="60px" height="60px">
      <h1>𝐓𝐑𝐀𝐍𝐒𝐌𝐈𝐒𝐒𝐈𝐎𝐍 𝐂𝐎𝐑𝐏𝐎𝐑𝐀𝐓𝐈𝐎𝐍 𝐎𝐅 𝐓𝐄𝐋𝐀𝐍𝐆𝐀𝐍𝐀 𝐋𝐈𝐌𝐈𝐓𝐄𝐃</h1>
      <button class="hamburger" id="hamburgerBtn">☰</button>
    </div>
  </div>
  <nav class="navbar" id="navbarMenu">
    <ul>
      <li><a href="https://400kvssshankarpally.free.nf/">Home</a></li>
      <li><a href="https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/LCbox_retrieve.html">MRT Schedules</a></li>
    </ul>
  </nav>

  <div class="container">
    <h2>Single Feeder MAX MW Data</h2>
    <form id="dataForm">
      <div class="form-item">
        <label for="voltage">Select Voltage Level:</label>
        <select id="voltage" name="voltage">
          <option value="">Select Voltage</option>
          <option value="400KV">400KV</option>
          <option value="220KV">220KV</option>
          <option value="ICTS">ICTS</option>
        </select>
      </div>
      <div class="form-item">
        <label for="feeder">Select Feeder:</label>
        <select id="feeder" name="feeder">
          <option value="">Select Feeder</option>
        </select>
      </div>
      <div class="form-item">
        <label for="fromDate">From Date:</label>
        <input type="date" id="fromDate" name="fromDate">
      </div>
      <div class="form-item">
        <label for="toDate">To Date:</label>
        <input type="date" id="toDate" name="toDate">
      </div>
      <div class="form-item">
        <input type="submit" value="Get Data">
      </div>
    </form>
  </div>

  <div id="fullScreenSpinner" style="display: none;">
    <div class="spinner"></div>
    <p>Loading data...</p>
  </div>

  <div class="data-container" id="dataContainer">
    <h2 id="dataHeader"></h2>
    <table id="dataTable">
      <thead>
        <tr>
          <th>Serial No.</th>
          <th>Feeder Name</th>
          <th>MW</th>
          <th>Date</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="buttons">
      <button id="downloadPDFButton" style="display: none;">Download as PDF</button>
      <button id="downloadExcelButton" style="display: none;">Download as Excel</button>
    </div>
    <div class="chart-container" style="width: 100%; margin: 20px auto;">
      <canvas id="mwChart" style="height: 400px;"></canvas>
    </div>
  </div>

  <div class="whatsapp-float" id="whatsappFloat">
    <div class="whatsapp-btn" id="whatsappBtn">
      <i class="fab fa-whatsapp fa-2x" style="color: white;"></i>
    </div>
    <div class="whatsapp-options" id="whatsappOptions">
      <a class="whatsapp-option" id="sharePdf">Share PDF</a>
      <a class="whatsapp-option" id="shareExcel">Share Excel</a>
    </div>
  </div>

  <script>
    let selectedFeeder = '';
    let selectedFromDate = '';
    let selectedToDate = '';
    let currentData = null;

    const feederOptions = {
      '400KV': ['400KV MAHESHWARAM-2', '400KV MAHESHWARAM-1', '400KV NARSAPUR-1', '400KV NARSAPUR-2', '400KV KETHIREDDYPALLY-1', '400KV KETHIREDDYPALLY-2', '400KV NIZAMABAD-1', '400KV NIZAMABAD-2'],
      '220KV': ['220KV PARIGI-1', '220KV PARIGI-2', '220KV TANDUR', '220KV GACHIBOWLI-1', '220KV GACHIBOWLI-2', '220KV KETHIREDDYPALLY', '220KV YEDDUMAILARAM-1', '220KV YEDDUMAILARAM-2', '220KV SADASIVAPET-1', '220KV SADASIVAPET-2'],
      'ICTS': ['315MVA ICT-1', '315MVA ICT-2', '315MVA ICT-3', '500MVA ICT-4']
    };

    function toggleWhatsAppOptions(show) {
      const options = document.getElementById('whatsappOptions');
      options.style.display = show ? 'flex' : 'none';
    }

    function isMobileView() {
      const width = window.innerWidth;
      console.log('Current width:', width);
      return width <= 768;
    }

    function showWhatsAppButton() {
      console.log('Attempting to show WhatsApp button');
      const whatsappFloat = document.getElementById('whatsappFloat');
      if (isMobileView()) {
        whatsappFloat.style.display = 'block';
        console.log('WhatsApp button should be visible');
      } else {
        console.log('Not mobile view, hiding WhatsApp button');
      }
    }

    function hideWhatsAppButton() {
      console.log('Hiding WhatsApp button');
      const whatsappFloat = document.getElementById('whatsappFloat');
      if (whatsappFloat) {
        whatsappFloat.style.display = 'none';
        toggleWhatsAppOptions(false);
      }
    }

    function displayData(data) {
      console.log('Displaying data:', data);
      const tableBody = document.querySelector('#dataTable tbody');
      const dataContainer = document.getElementById('dataContainer');
      const dataHeader = document.getElementById('dataHeader');

      if (!tableBody || !dataContainer || !dataHeader) {
        console.error('Required DOM elements not found');
        return;
      }

      tableBody.innerHTML = '';
      dataContainer.style.display = 'block';

      if (data.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: red;">No data found for the selected period.</td></tr>`;
        hideWhatsAppButton();
        return;
      }

      currentData = data;
      data.sort((a, b) => new Date(a.date + ' ' + a.time) - new Date(b.date + ' ' + b.time));

      let maxMW = Math.max(...data.map(item => Number(item.MW)));
      let maxMWRow = data.find(item => Number(item.MW) === maxMW);

      const formattedFromDate = formatDate(selectedFromDate);
      const formattedToDate = formatDate(selectedToDate);
      dataHeader.textContent = `${selectedFeeder} MAX MW From: ${formattedFromDate} To: ${formattedToDate}`;

      data.forEach((item, index) => {
        const row = document.createElement('tr');
        if (Number(item.MW) === maxMW) {
          row.style.backgroundColor = '#ffff00';
        }
        row.innerHTML = `
          <td>${index + 1}</td>
          <td>${item.feeder}</td>
          <td>${Math.round(Number(item.MW))}</td>
          <td>${formatDate(item.date)}</td>
          <td>${item.time}</td>
        `;
        tableBody.appendChild(row);
      });

      renderChart(data);
      showWhatsAppButton();
    }

    function renderChart(data) {
      const ctx = document.getElementById('mwChart').getContext('2d');
      if (window.mwChartInstance) {
        window.mwChartInstance.destroy();
      }

      const labels = data.map(item => `${formatDate(item.date)} ${item.time}`);
      const mwValues = data.map(item => Math.round(Number(item.MW)));

      window.mwChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'MW Over Time',
            data: mwValues,
            borderColor: '#3498db',
            backgroundColor: 'rgba(52, 152, 219, 0.2)',
            borderWidth: 2,
            pointRadius: 3,
            fill: true,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { title: { display: true, text: 'Date & Time' }, ticks: { autoSkip: false, maxRotation: 90, minRotation: 90 } },
            y: { title: { display: true, text: 'MW' }, beginAtZero: true }
          },
          plugins: { tooltip: { mode: 'index', intersect: false }, legend: { display: true } }
        }
      });
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      const day = date.getDate().toString().padStart(2, '0');
      const month = (date.getMonth() + 1).toString().padStart(2, '0');
      const year = date.getFullYear();
      return `${day}-${month}-${year}`;
    }

    async function fetchDataByDateRange(feeder, fromDate, toDate) {
      try {
        const response = await fetch(`https://maxregister-git-main-vinay-kumars-projects-f1559f4a.vercel.app/data-by-date?feeder=${feeder}&fromDate=${fromDate}&toDate=${toDate}`);
        if (!response.ok) throw new Error(`Network response was not ok: ${response.status}`);
        const data = await response.json();
        return data;
      } catch (error) {
        throw error;
      }
    }

    function resetForm() {
      const form = document.getElementById('dataForm');
      form.reset();
      document.getElementById('voltage').value = '';
      document.getElementById('feeder').innerHTML = '<option value="">Select Feeder</option>';
    }

    function generateAndSharePDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.addImage('logo_new.png', 'PNG', 14, 10, 30, 30);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(14);
      doc.text("TRANSMISSION CORPORATION OF TELANGANA LIMITED", 48, 20);

      const fromDateFormatted = formatDate(selectedFromDate);
      const toDateFormatted = formatDate(selectedToDate);
      const dynamicTitle = `${selectedFeeder} from ${fromDateFormatted} to ${toDateFormatted}`;

      const pageWidth = doc.internal.pageSize.getWidth();
      doc.setFont("helvetica", "normal");
      doc.setFontSize(10);
      const titleWidth = doc.getTextWidth(dynamicTitle);
      const titleX = (pageWidth - titleWidth) / 2;

      const tableStartY = 35;
      doc.text(dynamicTitle, titleX, tableStartY - 2);

      doc.autoTable({
        html: '#dataTable',
        startY: tableStartY,
        theme: "grid",
        headStyles: {
          fontSize: 10,
          fillColor: [52, 73, 94],
          textColor: 255
        },
        bodyStyles: { fontSize: 9 },
        margin: { top: 0 },
        didParseCell: function(data) {
          if (data.section === 'body') {
            const tableBody = document.querySelector('#dataTable tbody');
            const rows = Array.from(tableBody.getElementsByTagName('tr'));
            const rowIndex = data.row.index;
            if (rows[rowIndex] && rows[rowIndex].style.backgroundColor === 'rgb(255, 255, 0)') {
              data.cell.styles.fillColor = [255, 255, 0];
            }
          }
        }
      });

      const pdfBlob = doc.output('blob');
      const file = new File([pdfBlob], 'feeder_data.pdf', { type: 'application/pdf' });
      shareViaWhatsApp(file);
    }

    function generateAndShareExcel() {
      const wb = XLSX.utils.book_new();
      const sheet = XLSX.utils.table_to_sheet(document.getElementById('dataTable'));
      XLSX.utils.book_append_sheet(wb, sheet, 'Feeder Data');
      const excelBuffer = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
      const excelBlob = new Blob([excelBuffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const file = new File([excelBlob], 'feeder_data.xlsx', { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      shareViaWhatsApp(file);
    }

    function shareViaWhatsApp(file) {
      if (navigator.share && isMobileView()) {
        navigator.share({
          files: [file],
          title: `${selectedFeeder} Data Report`,
          text: `Data report for ${selectedFeeder} from ${formatDate(selectedFromDate)} to ${formatDate(selectedToDate)}`
        })
        .then(() => {
          toggleWhatsAppOptions(false);
        })
        .catch(error => {
          console.error('Error sharing:', error);
          alert('Error sharing file. Please try again.');
        });
      } else {
        alert('Web Share API not supported on this device/browser.');
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      const voltageSelect = document.getElementById('voltage');
      const feederSelect = document.getElementById('feeder');
      const form = document.getElementById('dataForm');
      const hamburgerBtn = document.getElementById('hamburgerBtn');
      const navbarMenu = document.getElementById('navbarMenu');
      const downloadPDFButton = document.getElementById('downloadPDFButton');
      const downloadExcelButton = document.getElementById('downloadExcelButton');
      const whatsappBtn = document.getElementById('whatsappBtn');
      const whatsappFloat = document.getElementById('whatsappFloat');
      const whatsappOptions = document.getElementById('whatsappOptions');
      const sharePdf = document.getElementById('sharePdf');
      const shareExcel = document.getElementById('shareExcel');

      voltageSelect.addEventListener('change', function() {
        const voltage = this.value;
        feederSelect.innerHTML = '<option value="">Select Feeder</option>';
        if (feederOptions[voltage]) {
          feederOptions[voltage].forEach(feeder => {
            const option = document.createElement('option');
            option.value = feeder;
            option.textContent = feeder;
            feederSelect.appendChild(option);
          });
        }
      });

      form.addEventListener('submit', function(event) {
        event.preventDefault();
        event.stopPropagation();

        const spinner = document.getElementById('fullScreenSpinner');
        spinner.style.display = 'flex';

        const voltage = voltageSelect.value;
        const feeder = feederSelect.value;
        const fromDate = document.getElementById('fromDate').value;
        const toDate = document.getElementById('toDate').value;

        selectedFeeder = feeder;
        selectedFromDate = fromDate;
        selectedToDate = toDate;

        if (!voltage || !feeder || !fromDate || !toDate) {
          alert('Please fill in all fields.');
          spinner.style.display = 'none';
          return;
        }

        if (new Date(fromDate) > new Date(toDate)) {
          alert('From Date cannot be later than To Date.');
          spinner.style.display = 'none';
          return;
        }

        fetchDataByDateRange(feeder, fromDate, toDate)
          .then(data => {
            displayData(data);
            downloadPDFButton.style.display = 'inline-block';
            downloadExcelButton.style.display = 'inline-block';
            resetForm();
          })
          .catch(error => {
            alert('Failed to fetch data. Please try again.');
          })
          .finally(() => {
            spinner.style.display = 'none';
          });
      });

      hamburgerBtn.addEventListener('click', function() {
        navbarMenu.classList.toggle('active');
        document.body.classList.toggle('navbar-open');
      });

      navbarMenu.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', function() {
          navbarMenu.classList.remove('active');
          document.body.classList.remove('navbar-open');
        });
      });

      document.addEventListener('click', function(event) {
        if (!navbarMenu.contains(event.target) && !hamburgerBtn.contains(event.target) && navbarMenu.classList.contains('active')) {
          navbarMenu.classList.remove('active');
          document.body.classList.remove('navbar-open');
        }
      });

      downloadPDFButton.addEventListener('click', function() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.addImage('logo_new.png', 'PNG', 14, 10, 30, 30);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(14);
        doc.text("TRANSMISSION CORPORATION OF TELANGANA LIMITED", 48, 20);
        
        const fromDateFormatted = formatDate(selectedFromDate);
        const toDateFormatted = formatDate(selectedToDate);
        const dynamicTitle = `${selectedFeeder} from ${fromDateFormatted} to ${toDateFormatted}`;
        
        const pageWidth = doc.internal.pageSize.getWidth();
        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);
        const titleWidth = doc.getTextWidth(dynamicTitle);
        const titleX = (pageWidth - titleWidth) / 2;
        
        const tableStartY = 35;
        doc.text(dynamicTitle, titleX, tableStartY - 2);

        doc.autoTable({
          html: '#dataTable',
          startY: tableStartY,
          theme: "grid",
          headStyles: { 
            fontSize: 10,
            fillColor: [52, 73, 94],
            textColor: 255
          },
          bodyStyles: { fontSize: 9 },
          margin: { top: 0 },
          didParseCell: function(data) {
            if (data.section === 'body') {
              const tableBody = document.querySelector('#dataTable tbody');
              const rows = Array.from(tableBody.getElementsByTagName('tr'));
              const rowIndex = data.row.index;
              if (rows[rowIndex] && rows[rowIndex].style.backgroundColor === 'rgb(255, 255, 0)') {
                data.cell.styles.fillColor = [255, 255, 0];
              }
            }
          }
        });

        doc.save('feeder_data.pdf');
      });

      downloadExcelButton.addEventListener('click', function() {
        const wb = XLSX.utils.book_new();
        const sheet = XLSX.utils.table_to_sheet(document.getElementById('dataTable'));
        XLSX.utils.book_append_sheet(wb, sheet, 'Feeder Data');
        XLSX.writeFile(wb, 'feeder_data.xlsx');
      });

      whatsappBtn.addEventListener('click', function() {
        console.log('WhatsApp button clicked');
        toggleWhatsAppOptions(true);
      });

      document.addEventListener('click', function(event) {
        if (!whatsappFloat.contains(event.target) && whatsappOptions.style.display === 'flex') {
          toggleWhatsAppOptions(false);
        }
      });

      sharePdf.addEventListener('click', function(e) {
        e.preventDefault();
        generateAndSharePDF();
      });

      shareExcel.addEventListener('click', function(e) {
        e.preventDefault();
        generateAndShareExcel();
      });
    });

    window.addEventListener('resize', function() {
      if (!isMobileView()) {
        hideWhatsAppButton();
      } else if (currentData && currentData.length > 0) {
        showWhatsAppButton();
      }
    });
  </script>
</body>
</html>
