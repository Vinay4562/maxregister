<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Single Feeder MAX Data</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.4/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.17/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="newdataCSS.css">
  <style>
    .chat-container { position: fixed; bottom: 20px; right: 20px; width: 300px; height: 400px; background: white; border: 1px solid #ccc; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
    .chat-header { background: #3498db; color: white; padding: 10px; border-radius: 5px 5px 0 0; }
    .chat-messages { flex: 1; padding: 10px; overflow-y: auto; }
    .chat-input { padding: 10px; border-top: 1px solid #ccc; }
    .chat-input input { width: 80%; padding: 5px; }
    .chat-input button { padding: 5px 10px; }
    .message { margin: 5px 0; }
    .user-message { text-align: right; color: #2ecc71; }
    .bot-message { text-align: left; color: #3498db; }
  </style>
</head>
<body>
  <!-- [Existing header, form, spinner, and data container unchanged] -->
  <div class="header">
    <div class="header-content">
      <img src="logo_new.png" alt="Logo" width="60px" height="60px">
      <h1>𝐓𝐑𝐀𝐍𝐒𝐌𝐈𝐒𝐒𝐈𝐎𝐍 𝐂𝐎𝐑𝐏𝐎𝐑𝐀𝐓𝐈𝐎𝐍 𝐎𝐅 𝐓𝐄𝐋𝐀𝐍𝐆𝐀𝐍𝐀 𝐋𝐈𝐌𝐈𝐓𝐄𝐃</h1>
    </div>
    <nav class="navbar">
      <ul>
        <li><a href="https://400kvssshankarpally.free.nf/">Home</a></li>
        <li><a href="https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/LCbox_retrieve.html">MRT Schedules</a></li>
      </ul>
    </nav>
  </div>

  <div class="container">
    <h2>Single Feeder MAX MW Data</h2>
    <form id="dataForm">
      <div class="form-item">
        <label for="voltage">Select Voltage Level:</label>
        <select id="voltage" name="voltage">
          <option value="">Select Voltage</option>
          <option value="400KV">400KV</option>
          <option value="220KV">220KV</option>
          <option value="ICTS">ICTS</option>
        </select>
      </div>
      <div class="form-item">
        <label for="feeder">Select Feeder:</label>
        <select id="feeder" name="feeder">
          <option value="">Select Feeder</option>
        </select>
      </div>
      <div class="form-item">
        <label for="fromDate">From Date:</label>
        <input type="date" id="fromDate" name="fromDate">
      </div>
      <div class="form-item">
        <label for="toDate">To Date:</label>
        <input type="date" id="toDate" name="toDate">
      </div>
      <div class="form-item">
        <input type="submit" value="Get Data">
      </div>
    </form>
  </div>

  <div id="fullScreenSpinner" style="display: none;">
    <div class="spinner"></div>
    <p>Loading data...</p>
  </div>

  <div class="data-container" id="dataContainer">
    <h2 id="dataHeader"></h2>
    <table id="dataTable">
      <thead>
        <tr>
          <th>Serial No.</th>
          <th>Feeder Name</th>
          <th>MW</th>
          <th>Date</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="buttons">
      <button id="downloadPDFButton" style="display: none;">Download as PDF</button>
      <button id="downloadExcelButton" style="display: none;">Download as Excel</button>
    </div>
    <div class="chart-container" style="width: 100%; margin: 20px auto;">
      <canvas id="mwChart" style="height: 400px;"></canvas>
    </div>
  </div>

  <div class="chat-container">
    <div class="chat-header">Feeder Data Bot</div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
      <input type="text" id="chatInput" placeholder="e.g., 'max 400KV Maheshwaram-2 March 2020 December 2021' or 'min...'">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    let selectedFeeder = '';
    let selectedFromDate = '';
    let selectedToDate = '';

    const feederOptions = {
      '400KV': ['400KV MAHESHWARAM-2', '400KV MAHESHWARAM-1', '400KV NARSAPUR-1', '400KV NARSAPUR-2', '400KV KETHIREDDYPALLY-1', '400KV KETHIREDDYPALLY-2', '400KV NIZAMABAD-1', '400KV NIZAMABAD-2'],
      '220KV': ['220KV PARIGI-1', '220KV PARIGI-2', '220KV TANDUR', '220KV GACHIBOWLI-1', '220KV GACHIBOWLI-2', '220KV KETHIREDDYPALLY', '220KV YEDDUMAILARAM-1', '220KV YEDDUMAILARAM-2', '220KV SADASIVAPET-1', '220KV SADASIVAPET-2'],
      'ICTS': ['315MVA ICT-1', '315MVA ICT-2', '315MVA ICT-3', '500MVA ICT-4']
    };

    document.addEventListener('DOMContentLoaded', function() {
      console.log('DOM fully loaded');

      const voltageSelect = document.getElementById('voltage');
      const feederSelect = document.getElementById('feeder');

      voltageSelect.addEventListener('change', function() {
        const voltage = this.value;
        console.log('Voltage selected:', voltage);
        feederSelect.innerHTML = '<option value="">Select Feeder</option>';
        if (feederOptions[voltage]) {
          feederOptions[voltage].forEach(feeder => {
            const option = document.createElement('option');
            option.value = feeder;
            option.textContent = feeder;
            feederSelect.appendChild(option);
          });
        }
      });

      const form = document.getElementById('dataForm');
      form.addEventListener('submit', function(event) {
        event.preventDefault();
        event.stopPropagation();
        console.log('Form submission intercepted');

        const spinner = document.getElementById('fullScreenSpinner');
        spinner.style.display = 'flex';

        const voltage = document.getElementById('voltage').value;
        const feeder = document.getElementById('feeder').value;
        const fromDate = document.getElementById('fromDate').value;
        const toDate = document.getElementById('toDate').value;

        selectedFeeder = feeder;
        selectedFromDate = fromDate;
        selectedToDate = toDate;

        console.log('Form data:', { voltage, feeder, fromDate, toDate });

        if (!voltage || !feeder || !fromDate || !toDate) {
          alert('Please fill in all fields.');
          spinner.style.display = 'none';
          return;
        }

        if (new Date(fromDate) > new Date(toDate)) {
          alert('From Date cannot be later than To Date.');
          spinner.style.display = 'none';
          return;
        }

        fetchDataByDateRange(feeder, fromDate, toDate)
          .then(data => {
            console.log('Data fetched:', data);
            displayData(data);
            document.getElementById('downloadPDFButton').style.display = 'inline-block';
            document.getElementById('downloadExcelButton').style.display = 'inline-block';
            resetForm();
          })
          .catch(error => {
            console.error('Error fetching data:', error);
            alert('Failed to fetch data. Please try again.');
          })
          .finally(() => {
            spinner.style.display = 'none';
          });
      });

      addBotMessage('Welcome! Try: "max [feeder] [Month Year] [Month Year]", "min [feeder] [Month Year] [Month Year]", "get data for [feeder] from [YYYY-MM-DD] to [YYYY-MM-DD]", or "what is the maximum MW value for..."');
    });

    function addMessage(message, className) {
      const chatMessages = document.getElementById('chatMessages');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${className}`;
      msgDiv.textContent = message;
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function addUserMessage(message) {
      addMessage(message, 'user-message');
    }

    function addBotMessage(message) {
      addMessage(message, 'bot-message');
    }

    function parseGetDataCommand(command) {
      const pattern = /get data for (.+?) from (\d{4}-\d{2}-\d{2}) to (\d{4}-\d{2}-\d{2})/i;
      const match = command.match(pattern);
      if (match) {
        return { type: 'getData', feeder: match[1].trim(), fromDate: match[2], toDate: match[3] };
      }
      return null;
    }

    function parseMaxMWCommand(command) {
      const pattern = /what is the maximum MW value for (.+?) from ([A-Za-z]+ \d{4}) to ([A-Za-z]+ \d{4})/i;
      const match = command.match(pattern);
      if (match) {
        const feeder = match[1].trim();
        const fromDateStr = match[2];
        const toDateStr = match[3];
        const fromDate = convertMonthYearToDate(fromDateStr);
        const toDate = convertMonthYearToDate(toDateStr, true);
        return { type: 'maxMW', feeder, fromDate, toDate };
      }
      return null;
    }

    // New short command parsers
    function parseShortMaxCommand(command) {
      const pattern = /max (.+?) ([A-Za-z]+ \d{4}) ([A-Za-z]+ \d{4})/i;
      const match = command.match(pattern);
      if (match) {
        const feeder = match[1].trim();
        const fromDateStr = match[2];
        const toDateStr = match[3];
        const fromDate = convertMonthYearToDate(fromDateStr);
        const toDate = convertMonthYearToDate(toDateStr, true);
        return { type: 'maxMW', feeder, fromDate, toDate };
      }
      return null;
    }

    function parseShortMinCommand(command) {
      const pattern = /min (.+?) ([A-Za-z]+ \d{4}) ([A-Za-z]+ \d{4})/i;
      const match = command.match(pattern);
      if (match) {
        const feeder = match[1].trim();
        const fromDateStr = match[2];
        const toDateStr = match[3];
        const fromDate = convertMonthYearToDate(fromDateStr);
        const toDate = convertMonthYearToDate(toDateStr, true);
        return { type: 'minMW', feeder, fromDate, toDate };
      }
      return null;
    }

    function convertMonthYearToDate(monthYear, endOfMonth = false) {
      const [monthStr, year] = monthYear.split(' ');
      const monthMap = {
        'january': '01', 'february': '02', 'march': '03', 'april': '04', 'may': '05', 'june': '06',
        'july': '07', 'august': '08', 'september': '09', 'october': '10', 'november': '11', 'december': '12'
      };
      const month = monthMap[monthStr.toLowerCase()];
      if (!month) return null;
      return endOfMonth ? `${year}-${month}-31` : `${year}-${month}-01`;
    }

    function sendMessage() {
      const input = document.getElementById('chatInput');
      const command = input.value.trim();
      if (!command) return;

      addUserMessage(command);
      input.value = '';

      const allFeeders = Object.values(feederOptions).flat();

      const getDataParsed = parseGetDataCommand(command);
      const maxMWParsed = parseMaxMWCommand(command);
      const shortMaxParsed = parseShortMaxCommand(command);
      const shortMinParsed = parseShortMinCommand(command);

      const parsed = shortMaxParsed || shortMinParsed || maxMWParsed || getDataParsed;

      if (!parsed) {
        addBotMessage('Invalid command. Use: "max [feeder] [Month Year] [Month Year]", "min [feeder] [Month Year] [Month Year]", "get data for [feeder] from [YYYY-MM-DD] to [YYYY-MM-DD]", or "what is the maximum MW value for..."');
        return;
      }

      const { type, feeder, fromDate, toDate } = parsed;

      if (!fromDate || !toDate) {
        addBotMessage('Error: Invalid date format. Use "Month Year" (e.g., March 2020).');
        return;
      }

      if (!allFeeders.includes(feeder)) {
        addBotMessage(`Error: Invalid feeder "${feeder}". Please select a valid feeder.`);
        return;
      }

      if (new Date(fromDate) > new Date(toDate)) {
        addBotMessage('Error: From Date cannot be later than To Date.');
        return;
      }

      addBotMessage(`Fetching ${type === 'minMW' ? 'minimum' : 'maximum'} MW for ${feeder} from ${fromDate} to ${toDate}...`);
      document.getElementById('fullScreenSpinner').style.display = 'flex';

      if (type === 'getData') {
        selectedFeeder = feeder;
        selectedFromDate = fromDate;
        selectedToDate = toDate;

        fetchDataByDateRange(feeder, fromDate, toDate)
          .then(data => {
            displayData(data);
            document.getElementById('downloadPDFButton').style.display = 'inline-block';
            document.getElementById('downloadExcelButton').style.display = 'inline-block';
            addBotMessage(`Data retrieved successfully! Showing ${data.length} records.`);
          })
          .catch(error => {
            console.error('Error fetching data:', error);
            addBotMessage('Failed to fetch data. Please try again.');
          })
          .finally(() => {
            document.getElementById('fullScreenSpinner').style.display = 'none';
          });
      } else if (type === 'maxMW' || type === 'minMW') {
        fetchDataByDateRange(feeder, fromDate, toDate)
          .then(data => {
            if (data.length === 0) {
              addBotMessage(`No data found for ${feeder} from ${fromDate} to ${toDate}.`);
            } else {
              const mwValues = data.map(item => Number(item.MW));
              const value = type === 'maxMW' ? Math.max(...mwValues) : Math.min(...mwValues);
              const entry = data.find(item => Number(item.MW) === value);
              addBotMessage(`${type === 'maxMW' ? 'Maximum' : 'Minimum'} MW for ${feeder}: ${Math.round(value)} MW on ${formatDate(entry.date)} at ${entry.time}`);
            }
          })
          .catch(error => {
            console.error('Error fetching data:', error);
            addBotMessage('Failed to fetch data. Please try again.');
          })
          .finally(() => {
            document.getElementById('fullScreenSpinner').style.display = 'none';
          });
      }
    }

    document.getElementById('chatInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') sendMessage();
    });

    async function fetchDataByDateRange(feeder, fromDate, toDate) {
      try {
        const response = await fetch(`https://maxregister-git-main-vinay-kumars-projects-f1559f4a.vercel.app/data-by-date?feeder=${feeder}&fromDate=${fromDate}&toDate=${toDate}`);
        if (!response.ok) throw new Error(`Network response was not ok: ${response.status}`);
        const data = await response.json();
        return data;
      } catch (error) {
        console.error(`Error fetching data for ${feeder}:`, error);
        throw error;
      }
    }

    function resetForm() {
      const form = document.getElementById('dataForm');
      form.reset();
      document.getElementById('voltage').value = '';
      document.getElementById('feeder').innerHTML = '<option value="">Select Feeder</option>';
      console.log('Form reset for new data entry');
    }

    function displayData(data) {
      const tableBody = document.querySelector('#dataTable tbody');
      tableBody.innerHTML = '';
      const dataContainer = document.getElementById('dataContainer');
      const dataHeader = document.getElementById('dataHeader');
      dataContainer.style.display = 'block';

      if (data.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: red;">No data found for the selected period.</td></tr>`;
        return;
      }

      data.sort((a, b) => new Date(a.date + ' ' + a.time) - new Date(b.date + ' ' + b.time));

      let maxMW = Math.max(...data.map(item => Number(item.MW)));
      let maxMWRow = data.find(item => Number(item.MW) === maxMW);

      const formattedFromDate = formatDate(selectedFromDate);
      const formattedToDate = formatDate(selectedToDate);
      dataHeader.textContent = `${selectedFeeder} MAX MW From: ${formattedFromDate} To: ${formattedToDate}`;

      data.forEach((item, index) => {
        const row = document.createElement('tr');
        if (Number(item.MW) === maxMW) {
          row.style.backgroundColor = '#ffff00';
        }
        row.innerHTML = `
          <td>${index + 1}</td>
          <td>${item.feeder}</td>
          <td>${Math.round(Number(item.MW))}</td>
          <td>${formatDate(item.date)}</td>
          <td>${item.time}</td>
        `;
        tableBody.appendChild(row);
      });

      renderChart(data);
    }

    function renderChart(data) {
      const ctx = document.getElementById('mwChart').getContext('2d');
      if (window.mwChartInstance) {
        window.mwChartInstance.destroy();
      }

      const labels = data.map(item => `${formatDate(item.date)} ${item.time}`);
      const mwValues = data.map(item => Math.round(Number(item.MW)));

      window.mwChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'MW Over Time',
            data: mwValues,
            borderColor: '#3498db',
            backgroundColor: 'rgba(52, 152, 219, 0.2)',
            borderWidth: 2,
            pointRadius: 3,
            fill: true,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { title: { display: true, text: 'Date & Time' }, ticks: { autoSkip: false, maxRotation: 90, minRotation: 90 } },
            y: { title: { display: true, text: 'MW' }, beginAtZero: true }
          },
          plugins: { tooltip: { mode: 'index', intersect: false }, legend: { display: true } }
        }
      });
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      const day = date.getDate().toString().padStart(2, '0');
      const month = (date.getMonth() + 1).toString().padStart(2, '0');
      const year = date.getFullYear();
      return `${day}-${month}-${year}`;
    }

    document.getElementById('downloadPDFButton').addEventListener('click', function() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      
      doc.addImage('logo_new.png', 'PNG', 14, 10, 30, 30);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(14);
      doc.text("TRANSMISSION CORPORATION OF TELANGANA LIMITED", 48, 20);
      
      const fromDateFormatted = formatDate(selectedFromDate);
      const toDateFormatted = formatDate(selectedToDate);
      const dynamicTitle = `${selectedFeeder} from ${fromDateFormatted} to ${toDateFormatted}`;
      
      const pageWidth = doc.internal.pageSize.getWidth();
      doc.setFont("helvetica", "normal");
      doc.setFontSize(10);
      const titleWidth = doc.getTextWidth(dynamicTitle);
      const titleX = (pageWidth - titleWidth) / 2;
      
      const tableStartY = 35;
      doc.text(dynamicTitle, titleX, tableStartY - 2);

      doc.autoTable({
        html: '#dataTable',
        startY: tableStartY,
        theme: "grid",
        headStyles: { 
          fontSize: 10,
          fillColor: [52, 73, 94],
          textColor: 255
        },
        bodyStyles: { fontSize: 9 },
        margin: { top: 0 },
        didParseCell: function(data) {
          if (data.section === 'body') {
            const tableBody = document.querySelector('#dataTable tbody');
            const rows = Array.from(tableBody.getElementsByTagName('tr'));
            const rowIndex = data.row.index;
            if (rows[rowIndex] && rows[rowIndex].style.backgroundColor === 'rgb(255, 255, 0)') {
              data.cell.styles.fillColor = [255, 255, 0];
            }
          }
        }
      });

      doc.save('feeder_data.pdf');
    });

    document.getElementById('downloadExcelButton').addEventListener('click', function() {
      const wb = XLSX.utils.book_new();
      const sheet = XLSX.utils.table_to_sheet(document.getElementById('dataTable'));
      XLSX.utils.book_append_sheet(wb, sheet, 'Feeder Data');
      XLSX.writeFile(wb, 'feeder_data.xlsx');
    });
  </script>
</body>
</html>
