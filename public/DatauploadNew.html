<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extract Data</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f4f4f9;
      color: #333;
      margin: 0;
      padding: 0;
    }
    .header {
      background-color: #2c3e50;
      color: #fff;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .header h1 {
      margin: 0;
      font-size: 2rem;
    }
    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .filter-section {
      margin-bottom: 20px;
    }
    .filter-section label {
      font-weight: bold;
      margin-right: 10px;
    }
    .filter-section select,
    .filter-section input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-right: 10px;
    }
    .filter-section button {
      padding: 8px 16px;
      background-color: #3498db;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .filter-section button:hover {
      background-color: #2980b9;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    .data-table th,
    .data-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    .data-table th {
      background-color: #3498db;
      color: #fff;
    }
    .data-table tr:hover {
      background-color: #f1f1f1;
    }
    .no-data {
        text-align: center;
        color: #ff4444; /* Red color for emphasis */
        font-weight: bold;
        margin-top: 20px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <h1>Extract Saved Data</h1>
  </div>

  <!-- Container -->
  <div class="container">
    <!-- Voltage Level Selection -->
    <div class="filter-section">
      <label for="voltageLevel">Select Voltage Level:</label>
      <select id="voltageLevel">
        <option value="">Select Voltage</option>
        <option value="400KV">400KV</option>
        <option value="220KV">220KV</option>
        <option value="ICTS">ICT'S</option>
      </select>
    </div>

    <!-- Feeder Selection (Hidden by Default) -->
    <div class="filter-section hidden" id="feederSection">
      <label for="feeder">Select Feeder/ICT:</label>
      <select id="feeder">
        <!-- Options will be dynamically populated based on voltage level -->
      </select>
    </div>

    <!-- Date Range Selection (Hidden by Default) -->
    <div class="filter-section hidden" id="dateRangeSection">
      <label for="fromDate">From Date:</label>
      <input type="date" id="fromDate">
      <label for="toDate">To Date:</label>
      <input type="date" id="toDate">
      <button id="fetchDataBtn">Fetch Data</button>
    </div>

    <!-- Data Table -->
    <table class="data-table hidden" id="dataTable">
      <thead>
        <tr>
          <th>Voltage</th>
          <th>Feeder/ICT</th>
          <th>Year</th>
          <th>MW</th>
          <th>Date</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody>
        <!-- Data rows will be dynamically added here -->
      </tbody>
    </table>

    <!-- No Data Message -->
    <div class="no-data hidden" id="noDataMessage">
      No data available for the selected date range.
    </div>
  </div>

  <script>
    const voltageLevelSelect = document.getElementById('voltageLevel');
    const feederSection = document.getElementById('feederSection');
    const feederSelect = document.getElementById('feeder');
    const dateRangeSection = document.getElementById('dateRangeSection');
    const fetchDataBtn = document.getElementById('fetchDataBtn');
    const dataTable = document.getElementById('dataTable');
    const noDataMessage = document.getElementById('noDataMessage');

    // Feeder options for each voltage level
    const feeders = {
      '400KV': ['400KV MAHESHWARAM-2', '400KV MAHESHWARAM-1', '400KV NARSAPUR-1', '400KV NARSAPUR-2', '400KV KETHIREDDYPALLY-1', '400KV KETHIREDDYPALLY-2', '400KV NIZAMABAD-1', '400KV NIZAMABAD-2'],
      '220KV': ['220KV PARIGI-1', '220KV PARIGI-2', '220KV TANDUR', '220KV GACHIBOWLI-1', '220KV GACHIBOWLI-2', '220KV KETHIREDDYPALLY', '220KV YEDDUMAILARAM-1', '220KV YEDDUMAILARAM-2', '220KV SADASIVAPET-1', '220KV SADASIVAPET-2'],
      'ICTS': ['315MVA ICT-1', '315MVA ICT-2', '315MVA ICT-3', '500MVA ICT-4']
    };

    // Event listener for voltage level selection
    voltageLevelSelect.addEventListener('change', () => {
      const selectedVoltage = voltageLevelSelect.value;

      if (selectedVoltage) {
        // Populate feeder options
        feederSelect.innerHTML = feeders[selectedVoltage].map(feeder => `
          <option value="${feeder}">${feeder}</option>
        `).join('');

        // Show feeder and date range sections
        feederSection.classList.remove('hidden');
        dateRangeSection.classList.remove('hidden');
      } else {
        // Hide sections if no voltage level is selected
        feederSection.classList.add('hidden');
        dateRangeSection.classList.add('hidden');
        dataTable.classList.add('hidden');
        noDataMessage.classList.add('hidden');
      }
    });

    // Event listener for fetch data button
    fetchDataBtn.addEventListener('click', fetchData);

    async function fetchData() {
        const selectedVoltage = voltageLevelSelect.value;
        const selectedFeeder = feederSelect.value;
        const fromDate = document.getElementById('fromDate').value;
        const toDate = document.getElementById('toDate').value;

        if (!selectedVoltage || !selectedFeeder || !fromDate || !toDate) {
            alert('Please select a voltage level, feeder, and date range.');
            return;
        }

        if (new Date(fromDate) > new Date(toDate)) {
            alert('"From Date" cannot be greater than "To Date".');
            return;
        }

        try {
            // Show loading spinner
            document.getElementById('loadingSpinner').classList.remove('hidden');

            const response = await fetch(`https://maxregister-git-main-vinay-kumars-projects-f1559f4a.vercel.app/extract-data?voltage=${selectedVoltage}&feeder=${selectedFeeder}&fromDate=${fromDate}&toDate=${toDate}`);
            if (!response.ok) {
            throw new Error('Failed to fetch data');
            }
            const data = await response.json();

            const tableBody = document.querySelector('#dataTable tbody');
            tableBody.innerHTML = ''; // Clear previous data

            if (data.length === 0) {
            noDataMessage.classList.remove('hidden');
            dataTable.classList.add('hidden');
            } else {
            noDataMessage.classList.add('hidden');
            dataTable.classList.remove('hidden');
            data.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                <td>${item.voltage}</td>
                <td>${item.feeder}</td>
                <td>${item.year}</td>
                <td>${item.MW}</td>
                <td>${item.date}</td>
                <td>${item.time}</td>
                `;
                tableBody.appendChild(row);
            });
            }
        } catch (error) {
            console.error('Error fetching data:', error);
            alert('An error occurred while fetching data. Please try again.');
        } finally {
            // Hide loading spinner
            document.getElementById('loadingSpinner').classList.add('hidden');
        }
    }
  </script>
</body>
</html>
