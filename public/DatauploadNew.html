<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extract Data</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f4f4f9;
      color: #333;
      margin: 0;
      padding: 0;
    }
    .header {
      background-color: #2c3e50;
      color: #fff;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .header h1 {
      margin: 0;
      font-size: 2rem;
    }
    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    #loadingSpinner {
      color: #3498db;
      font-size: 1.2rem;
    }
    .fa-spinner {
      margin-bottom: 10px;
    }

    .filter-section {
      margin-bottom: 20px;
    }
    .filter-section label {
      font-weight: bold;
      margin-right: 10px;
    }
    .filter-section select,
    .filter-section input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-right: 10px;
    }
    .filter-section button {
      padding: 8px 16px;
      background-color: #3498db;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .filter-section button:hover {
      background-color: #2980b9;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    .data-table th,
    .data-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    .data-table th {
      background-color: #3498db;
      color: #fff;
    }
    .data-table tr:hover {
      background-color: #f1f1f1;
    }
    .no-data {
        text-align: center;
        color: #ff4444; /* Red color for emphasis */
        font-weight: bold;
        margin-top: 20px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <h1>Extract Saved Data</h1>
  </div>

  <!-- Container -->
  <div class="container">
    <!-- Voltage Level Selection -->
    <div class="filter-section">
      <label for="voltageLevel">Select Voltage Level:</label>
      <select id="voltageLevel">
        <option value="">Select Voltage</option>
        <option value="400KV">400KV</option>
        <option value="220KV">220KV</option>
        <option value="ICTS">ICT'S</option>
      </select>
    </div>

    <!-- Feeder Selection (Hidden by Default) -->
    <div class="filter-section hidden" id="feederSection">
      <label for="feeder">Select Feeder/ICT:</label>
      <select id="feeder">
        <!-- Options will be dynamically populated based on voltage level -->
      </select>
    </div>

    <!-- Date Range Selection (Hidden by Default) -->
    <div class="filter-section hidden" id="dateRangeSection">
      <label for="fromDate">From Date:</label>
      <input type="date" id="fromDate">
      <label for="toDate">To Date:</label>
      <input type="date" id="toDate">
      <button id="fetchDataBtn">Fetch Data</button>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="hidden" style="text-align: center; margin-top: 20px;">
        <i class="fas fa-spinner fa-spin fa-2x"></i>
        <p>Loading data...</p>
      </div>

    <!-- Data Table -->
    <table class="data-table hidden" id="dataTable">
      <thead>
        <tr>
          <th>Voltage</th>
          <th>Feeder/ICT</th>
          <th>Year</th>
          <th>MW</th>
          <th>Date</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody>
        <!-- Data rows will be dynamically added here -->
      </tbody>
    </table>

    <!-- No Data Message -->
    <div class="no-data hidden" id="noDataMessage">
      No data available for the selected date range.
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
  const voltageLevelSelect = document.getElementById("voltageLevel");
  const feederSelect = document.getElementById("feeder");
  const fetchDataBtn = document.getElementById("fetchData");
  const dataTable = document.getElementById("dataTable");
  const tableBody = dataTable.querySelector("tbody");
  const noDataMessage = document.getElementById("noDataMessage");
  const loadingSpinner = document.getElementById("loadingSpinner");

  // Define feeders based on voltage levels
  const feeders = {
    "400KV Feeders": [
      "400KV MAHESHWARAM-2", "400KV MAHESHWARAM-1", "400KV NARSAPUR-1", "400KV NARSAPUR-2",
      "400KV KETHIREDDYPALLY-1", "400KV KETHIREDDYPALLY-2", "400KV NIZAMABAD-1", "400KV NIZAMABAD-2"
    ],
    "220KV Feeders": [
      "220KV PARIGI-1", "220KV PARIGI-2", "220KV THANDUR", "220KV GACHIBOWLI-1", "220KV GACHIBOWLI-2",
      "220KV KETHIREDDYPALLY", "220KV YEDDUMAILARAM-1", "220KV YEDDUMAILARAM-2", "220KV SADASIVAPET-1", "220KV SADASIVAPET-2"
    ],
    "ICT's": ["315MVA ICT-1", "315MVA ICT-2", "315MVA ICT-3", "500MVA ICT-4"]
  };

  // Populate feeders based on selected voltage level
  voltageLevelSelect.addEventListener("change", function () {
    const selectedVoltage = voltageLevelSelect.value;
    feederSelect.innerHTML = "<option value=''>Select Feeder</option>"; // Reset dropdown
    
    if (feeders[selectedVoltage]) {
      feeders[selectedVoltage].forEach(feeder => {
        const option = document.createElement("option");
        option.value = feeder;
        option.textContent = feeder;
        feederSelect.appendChild(option);
      });
    }
  });

  // Fetch data on button click
  fetchDataBtn.addEventListener("click", async () => {
    const voltage = voltageLevelSelect.value;
    const feeder = feederSelect.value;
    const fromDate = document.getElementById("fromDate").value;
    const toDate = document.getElementById("toDate").value;

    if (!voltage || !feeder || !fromDate || !toDate) {
      alert("Please select all fields before fetching data.");
      return;
    }

    // Show loading spinner
    loadingSpinner.classList.remove("hidden");
    dataTable.classList.add("hidden");
    noDataMessage.classList.add("hidden");

    try {
      const response = await fetch("/fetch-data", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ voltage, feeder, fromDate, toDate })
      });

      const data = await response.json();

      // Hide loading spinner
      loadingSpinner.classList.add("hidden");

      if (data.length > 0) {
        populateTable(data);
      } else {
        noDataMessage.classList.remove("hidden");
      }
    } catch (error) {
      console.error("Error fetching data:", error);
      alert("Failed to fetch data. Please try again.");
    }
  });

  function populateTable(data) {
    tableBody.innerHTML = ""; // Clear existing data

    data.forEach(row => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${row.voltage}</td>
        <td>${row.feeder}</td>
        <td>${row.year}</td>
        <td>${row.mw}</td>
        <td>${row.date}</td>
        <td>${row.time}</td>
      `;
      tableBody.appendChild(tr);
    });

    dataTable.classList.remove("hidden");
  }
});

  </script>
</body>
</html>
