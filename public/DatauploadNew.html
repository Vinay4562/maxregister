<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extract Data</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f4f4f9;
      color: #333;
      margin: 0;
      padding: 0;
    }
    .header {
      background-color: #2c3e50;
      color: #fff;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .header h1 {
      margin: 0;
      font-size: 2rem;
    }
    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    #loadingSpinner {
      color: #3498db;
      font-size: 1.2rem;
    }
    .fa-spinner {
      margin-bottom: 10px;
    }

    .filter-section {
      margin-bottom: 20px;
    }
    .filter-section label {
      font-weight: bold;
      margin-right: 10px;
    }
    .filter-section select,
    .filter-section input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-right: 10px;
    }
    .filter-section button {
      padding: 8px 16px;
      background-color: #3498db;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .filter-section button:hover {
      background-color: #2980b9;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    .data-table th,
    .data-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    .data-table th {
      background-color: #3498db;
      color: #fff;
    }
    .data-table tr:hover {
      background-color: #f1f1f1;
    }
    .no-data {
        text-align: center;
        color: #ff4444; /* Red color for emphasis */
        font-weight: bold;
        margin-top: 20px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h1>Data Upload</h1>

  <div>
    <label for="voltageLevel">Select Voltage Level:</label>
    <select id="voltageLevel">
      <option value="">Select Voltage Level</option>
      <option value="400KV Feeders">400KV Feeders</option>
      <option value="220KV Feeders">220KV Feeders</option>
      <option value="ICT's">ICT's</option>
    </select>
  </div>

  <div>
    <label for="feeder">Select Feeder:</label>
    <select id="feeder">
      <option value="">Select Feeder</option>
    </select>
  </div>

  <div>
    <label for="fromDate">From Date:</label>
    <input type="date" id="fromDate">
  </div>

  <div>
    <label for="toDate">To Date:</label>
    <input type="date" id="toDate">
  </div>

  <button id="fetchData">Fetch Data</button>

  <div id="loadingSpinner" class="hidden">Loading...</div>
  <div id="noDataMessage" class="hidden">No data available.</div>

  <table id="dataTable" class="hidden">
    <thead>
      <tr>
        <th>Voltage</th>
        <th>Feeder</th>
        <th>Year</th>
        <th>MW</th>
        <th>Date</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const voltageLevelSelect = document.getElementById("voltageLevel");
      const feederSelect = document.getElementById("feeder");
      const fetchDataBtn = document.getElementById("fetchData");
      const dataTable = document.getElementById("dataTable");
      const tableBody = dataTable.querySelector("tbody");
      const noDataMessage = document.getElementById("noDataMessage");
      const loadingSpinner = document.getElementById("loadingSpinner");

      // Define feeders based on voltage levels
      const feeders = {
        "400KV Feeders": [
          "400KV MAHESHWARAM-2", "400KV MAHESHWARAM-1", "400KV NARSAPUR-1", "400KV NARSAPUR-2",
          "400KV KETHIREDDYPALLY-1", "400KV KETHIREDDYPALLY-2", "400KV NIZAMABAD-1", "400KV NIZAMABAD-2"
        ],
        "220KV Feeders": [
          "220KV PARIGI-1", "220KV PARIGI-2", "220KV THANDUR", "220KV GACHIBOWLI-1", "220KV GACHIBOWLI-2",
          "220KV KETHIREDDYPALLY", "220KV YEDDUMAILARAM-1", "220KV YEDDUMAILARAM-2", "220KV SADASIVAPET-1", "220KV SADASIVAPET-2"
        ],
        "ICT's": ["315MVA ICT-1", "315MVA ICT-2", "315MVA ICT-3", "500MVA ICT-4"]
      };

      // Populate feeders based on selected voltage level
      voltageLevelSelect.addEventListener("change", function () {
        const selectedVoltage = voltageLevelSelect.value;
        feederSelect.innerHTML = "<option value=''>Select Feeder</option>"; // Reset dropdown
        
        if (feeders[selectedVoltage]) {
          feeders[selectedVoltage].forEach(feeder => {
            const option = document.createElement("option");
            option.value = feeder;
            option.textContent = feeder;
            feederSelect.appendChild(option);
          });
        }
      });

      // Fetch data on button click
fetchDataBtn.addEventListener("click", async () => {
  const voltage = voltageLevelSelect.value;
  const feeder = feederSelect.value;
  const fromDate = document.getElementById("fromDate").value;
  const toDate = document.getElementById("toDate").value;

  // Check if all fields are filled
  if (!voltage || !feeder || !fromDate || !toDate) {
    alert("Please select all fields before fetching data.");
    return;
  }

  // Convert fromDate and toDate to JavaScript Date objects
  const fromDateObj = new Date(fromDate);
  const toDateObj = new Date(toDate);

  // Validate if the dates are correct
  if (isNaN(fromDateObj) || isNaN(toDateObj)) {
    alert("Please enter valid dates.");
    return;
  }

  // Show loading spinner and hide data table/no data message
  loadingSpinner.classList.remove("hidden");
  dataTable.classList.add("hidden");
  noDataMessage.classList.add("hidden");

  try {
    const response = await fetch("/fetch-data", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ voltage, feeder, fromDate: fromDateObj.toISOString(), toDate: toDateObj.toISOString() })
    });

    // Hide the loading spinner once the request is complete
    loadingSpinner.classList.add("hidden");

    if (!response.ok) {
      throw new Error('Failed to fetch data');
    }

    const data = await response.json();
    
    if (data.length > 0) {
      populateTable(data);
    } else {
      noDataMessage.classList.remove("hidden");
    }
  } catch (error) {
    console.error("Error fetching data:", error);
    alert("Failed to fetch data. Please try again.");
    loadingSpinner.classList.add("hidden");
  }
});


      function populateTable(data) {
        tableBody.innerHTML = ""; // Clear existing data

        data.forEach(row => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${row.voltage}</td>
            <td>${row.feeder}</td>
            <td>${row.year}</td>
            <td>${row.mw}</td>
            <td>${row.date}</td>
            <td>${row.time}</td>
          `;
          tableBody.appendChild(tr);
        });

        dataTable.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
