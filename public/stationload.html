<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Station Load</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.4/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.17/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="newdataCSS.css">
  <style>
    #dataTable {
      width: 90%;
      margin: 20px auto;
      border-collapse: collapse;
      font-family: 'Arial', sans-serif;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    #dataTable th, #dataTable td {
      padding: 10px 12px;
      text-align: center;
      border: 1px solid #e0e0e0;
    }
    #dataTable th {
      background-color: #2c3e50;
      color: white;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 15px;
    }
    #dataTable td {
      font-size: 14px;
    }
    #dataTable th:nth-child(1), #dataTable td:nth-child(1) { width: 70px; }
    #dataTable th:nth-child(2), #dataTable td:nth-child(2) { width: 150px; }
    #dataTable th:nth-child(3), #dataTable td:nth-child(3) { width: 100px; }
    #dataTable th:nth-child(4), #dataTable td:nth-child(4) { width: 120px; }
    #dataTable th:nth-child(5), #dataTable td:nth-child(5) { width: 80px; }
    #dataTable tr:nth-child(even) { background-color: #f8f9fa; }
    #dataTable tr:nth-child(odd) { background-color: #ffffff; }
    #dataTable tr:hover:not(thead tr) { background-color: #eef2f7; transition: background-color 0.2s; }
    #dataTable tr.max-row { background-color: yellow !important; font-weight: bold; }
    .chart-container { width: 90%; margin: 20px auto; height: 400px; }
    .data-container h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; font-family: 'Arial', sans-serif; }
    .buttons { text-align: center; margin: 20px 0; }
    .buttons button { padding: 10px 20px; margin: 0 10px; background-color: #2c3e50; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; }
    .buttons button:hover { background-color: #34495e; }
    /* WhatsApp Button Styles */
    .whatsapp-float {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      display: none; /* Hidden by default, shown via JS */
    }

    .whatsapp-btn {
      background-color: #25D366; /* WhatsApp green */
      border-radius: 50%;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      cursor: pointer;
      animation: zoomInOut 2s infinite ease-in-out;
      overflow: hidden; /* Ensures no overflow */
    }

    @keyframes zoomInOut {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .whatsapp-options {
      position: absolute;
      bottom: 70px;
      right: 0;
      background-color: white;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      display: none;
      flex-direction: column;
      padding: 5px;
    }

    .whatsapp-option {
      padding: 8px 15px;
      cursor: pointer;
      color: #333;
      text-decoration: none;
      font-size: 14px;
    }

    .whatsapp-option:hover {
      background-color: #f0f0f0;
    }

    @media (min-width: 769px) {
      .whatsapp-float {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-content">
      <img src="logo_new.png" alt="Logo" width="60px" height="60px">
      <h1>𝐓𝐑𝐀𝐍𝐒𝐌𝐈𝐒𝐒𝐈𝐎𝐍 𝐂𝐎𝐑𝐏𝐎𝐑𝐀𝐓𝐈𝐎𝐍 𝐎𝐅 𝐓𝐄𝐋𝐀𝐍𝐆𝐀𝐍𝐀 𝐋𝐈𝐌𝐈𝐓𝐄𝐃</h1>
      <button class="hamburger" id="hamburgerBtn">☰</button>
    </div>
  </div>
  <nav class="navbar" id="navbarMenu">
    <ul>
      <li><a href="https://400kvssshankarpally.free.nf/">Home</a></li>
      <li><a href="https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/LCbox_retrieve.html">MRT Schedules</a></li>
    </ul>
  </nav>

  <div class="container">
    <h2>Station Loads Data</h2>
    <form id="dateForm">
      <div class="form-item">
        <label for="fromDate">From Date:</label>
        <input type="date" id="fromDate" name="fromDate">
      </div>
      <div class="form-item">
        <label for="toDate">To Date:</label>
        <input type="date" id="toDate" name="toDate">
      </div>
      <div class="form-item">
        <input type="submit" value="Get Data">
      </div>
    </form>
  </div>

  <div id="fullScreenSpinner" style="display: none;">
    <div class="spinner"></div>
    <p>Loading data...</p>
  </div>

  <div class="data-container" id="dataContainer" style="display: none;">
    <h2 id="dataHeader"></h2>
    <table id="dataTable">
      <thead>
        <tr>
          <th>Serial No.</th>
          <th>Month</th>
          <th>Station Loads</th>
          <th>Date</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="buttons">
      <button id="downloadPDFButton">Download as PDF</button>
      <button id="downloadExcelButton">Download as Excel</button>
    </div>
    <div class="chart-container">
      <canvas id="mwChart"></canvas>
    </div>
  </div>

  <!-- WhatsApp Floating Button -->
  <div class="whatsapp-float" id="whatsappFloat">
    <div class="whatsapp-btn" id="whatsappBtn">
      <i class="fab fa-whatsapp fa-2x" style="color: white;"></i>
    </div>
    <div class="whatsapp-options" id="whatsappOptions">
      <a class="whatsapp-option" id="sharePdf">Share PDF</a>
      <a class="whatsapp-option" id="shareExcel">Share Excel</a>
    </div>
  </div>

  <script>
    const ICTS_FEEDERS = ['315MVA ICT-1', '315MVA ICT-2', '315MVA ICT-3', '500MVA ICT-4'];
    let selectedFromDate = '';
    let selectedToDate = '';
    let monthlyData = [];

    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('dateForm');
      form.addEventListener('submit', async function(event) {
        event.preventDefault();
        const spinner = document.getElementById('fullScreenSpinner');
        spinner.style.display = 'flex';

        selectedFromDate = document.getElementById('fromDate').value;
        selectedToDate = document.getElementById('toDate').value;

        if (!selectedFromDate || !selectedToDate) {
          alert('Please select both From Date and To Date.');
          spinner.style.display = 'none';
          return;
        }

        if (new Date(selectedFromDate) > new Date(selectedToDate)) {
          alert('From Date cannot be later than To Date.');
          spinner.style.display = 'none';
          return;
        }

        try {
          monthlyData = await fetchMonthlyICTSData(selectedFromDate, selectedToDate);
          displayMonthlyData(monthlyData, selectedFromDate, selectedToDate);
          renderChart(monthlyData);
          document.getElementById('dataContainer').style.display = 'block';
          showWhatsAppButton();
        } catch (error) {
          console.error('Error fetching monthly data:', error);
          alert('Failed to fetch data. Please try again.');
          hideWhatsAppButton();
        } finally {
          spinner.style.display = 'none';
        }
      });

      // Hamburger menu functionality
      const hamburgerBtn = document.getElementById('hamburgerBtn');
      const navbarMenu = document.getElementById('navbarMenu');
      const body = document.body;

      hamburgerBtn.addEventListener('click', function() {
        navbarMenu.classList.toggle('active');
        body.classList.toggle('navbar-open');
      });

      navbarMenu.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', function() {
          navbarMenu.classList.remove('active');
          body.classList.remove('navbar-open');
        });
      });

      document.addEventListener('click', function(event) {
        if (!navbarMenu.contains(event.target) && !hamburgerBtn.contains(event.target) && navbarMenu.classList.contains('active')) {
          navbarMenu.classList.remove('active');
          body.classList.remove('navbar-open');
        }
      });

      // Download buttons
      document.getElementById('downloadPDFButton').addEventListener('click', downloadPDF);
      document.getElementById('downloadExcelButton').addEventListener('click', downloadExcel);

      // WhatsApp functionality
      document.getElementById('whatsappBtn').addEventListener('click', () => toggleWhatsAppOptions(true));
      document.addEventListener('click', (event) => {
        const whatsappFloat = document.getElementById('whatsappFloat');
        const whatsappOptions = document.getElementById('whatsappOptions');
        if (!whatsappFloat.contains(event.target) && whatsappOptions.style.display === 'flex') {
          toggleWhatsAppOptions(false);
        }
      });
      document.getElementById('sharePdf').addEventListener('click', (e) => {
        e.preventDefault();
        generateAndSharePDF();
      });
      document.getElementById('shareExcel').addEventListener('click', (e) => {
        e.preventDefault();
        generateAndShareExcel();
      });

      window.addEventListener('resize', () => {
        if (!isMobileView()) {
          hideWhatsAppButton();
        } else if (monthlyData.length > 0) {
          showWhatsAppButton();
        }
      });
    });

    async function fetchMonthlyICTSData(fromDate, toDate) {
      const start = new Date(fromDate);
      const end = new Date(toDate);
      const months = getMonthsBetween(start, end);

      const promises = ICTS_FEEDERS.map(feeder =>
        fetch(`https://maxregister-git-main-vinay-kumars-projects-f1559f4a.vercel.app/data-by-date?feeder=${feeder}&fromDate=${fromDate}&toDate=${toDate}`)
          .then(response => {
            if (!response.ok) throw new Error(`Failed to fetch data for ${feeder}`);
            return response.json();
          })
      );

      const allData = await Promise.all(promises);
      const combinedByDateTime = {};

      allData.forEach((feederData) => {
        feederData.forEach(entry => {
          const key = `${entry.date} ${entry.time}`;
          if (!combinedByDateTime[key]) {
            combinedByDateTime[key] = { date: entry.date, time: entry.time, mwSum: 0, count: 0 };
          }
          combinedByDateTime[key].mwSum += Number(entry.MW);
          combinedByDateTime[key].count += 1;
        });
      });

      const monthlyMax = {};
      for (const key in combinedByDateTime) {
        const entry = combinedByDateTime[key];
        if (entry.count !== ICTS_FEEDERS.length) continue;

        const date = new Date(entry.date);
        const monthKey = `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}`;
        if (!monthlyMax[monthKey] || entry.mwSum > monthlyMax[monthKey].mwSum) {
          monthlyMax[monthKey] = { mwSum: entry.mwSum, date: entry.date, time: entry.time };
        }
      }

      return months.map(month => {
        const monthKey = `${month.year}-${month.month}`;
        return monthlyMax[monthKey] ? {
          month: `${getMonthName(Number(month.month))} ${month.year}`,
          combinedMW: Math.round(monthlyMax[monthKey].mwSum),
          date: monthlyMax[monthKey].date,
          time: monthlyMax[monthKey].time
        } : {
          month: `${getMonthName(Number(month.month))} ${month.year}`,
          combinedMW: 'N/A',
          date: 'N/A',
          time: 'N/A'
        };
      });
    }

    function getMonthsBetween(start, end) {
      const months = [];
      let current = new Date(start);
      current.setDate(1);

      while (current <= end) {
        months.push({
          year: current.getFullYear(),
          month: (current.getMonth() + 1).toString().padStart(2, '0')
        });
        current.setMonth(current.getMonth() + 1);
      }
      return months;
    }

    function getMonthName(monthNumber) {
      const monthNames = [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'
      ];
      return monthNames[monthNumber - 1];
    }

    function displayMonthlyData(data, fromDate, toDate) {
      const tableBody = document.querySelector('#dataTable tbody');
      tableBody.innerHTML = '';
      const dataHeader = document.getElementById('dataHeader');
      dataHeader.textContent = `Station Loads From: ${formatDate(fromDate)} To: ${formatDate(toDate)}`;

      const maxMW = Math.max(...data.map(entry => entry.combinedMW === 'N/A' ? -Infinity : entry.combinedMW));

      data.forEach((entry, index) => {
        const row = document.createElement('tr');
        if (entry.combinedMW === maxMW) {
          row.classList.add('max-row');
        }
        row.innerHTML = `
          <td>${index + 1}</td>
          <td>${entry.month}</td>
          <td>${entry.combinedMW}</td>
          <td>${entry.combinedMW === 'N/A' ? 'N/A' : formatDate(entry.date)}</td>
          <td>${entry.time}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    function renderChart(data) {
      const ctx = document.getElementById('mwChart').getContext('2d');
      if (window.mwChartInstance) {
        window.mwChartInstance.destroy();
      }

      const labels = data.map(entry => entry.month);
      const mwValues = data.map(entry => entry.combinedMW === 'N/A' ? null : entry.combinedMW);

      window.mwChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Monthly MAX MW',
            data: mwValues,
            borderColor: '#3498db',
            backgroundColor: 'rgba(52, 152, 219, 0.2)',
            borderWidth: 2,
            pointRadius: 4,
            fill: false,
            tension: 0.1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { title: { display: true, text: 'Month' } },
            y: { title: { display: true, text: 'MW' }, beginAtZero: true }
          },
          plugins: {
            tooltip: { mode: 'index', intersect: false },
            legend: { display: true }
          }
        }
      });
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      const day = date.getDate().toString().padStart(2, '0');
      const month = (date.getMonth() + 1).toString().padStart(2, '0');
      const year = date.getFullYear();
      return `${day}-${month}-${year}`;
    }

    function downloadPDF() {
      if (!window.jspdf || !window.jspdf.jsPDF) {
        alert('jsPDF library failed to load. Please check your internet connection and try again.');
        return;
      }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.addImage('logo_new.png', 'PNG', 14, 10, 30, 30);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(14);
      doc.text("TRANSMISSION CORPORATION OF TELANGANA LIMITED", 48, 20);

      const dynamicTitle = `ICTS Monthly MAX MW from ${formatDate(selectedFromDate)} to ${formatDate(selectedToDate)}`;
      const pageWidth = doc.internal.pageSize.getWidth();
      doc.setFont("helvetica", "normal");
      doc.setFontSize(10);
      const titleWidth = doc.getTextWidth(dynamicTitle);
      const titleX = (pageWidth - titleWidth) / 2;

      const tableStartY = 35;
      doc.text(dynamicTitle, titleX, tableStartY - 2);

      doc.autoTable({
        html: '#dataTable',
        startY: tableStartY,
        theme: "grid",
        headStyles: { fontSize: 11, fillColor: [44, 62, 80], textColor: 255 },
        bodyStyles: { fontSize: 10 },
        columnStyles: {
          0: { cellWidth: 20 },
          1: { cellWidth: 40 },
          2: { cellWidth: 25 },
          3: { cellWidth: 30 },
          4: { cellWidth: 20 }
        },
        alternateRowStyles: { fillColor: [248, 249, 250] },
        didParseCell: function(data) {
          if (data.section === 'body') {
            const tableBody = document.querySelector('#dataTable tbody');
            const rows = Array.from(tableBody.getElementsByTagName('tr'));
            const rowIndex = data.row.index;
            if (rows[rowIndex] && rows[rowIndex].classList.contains('max-row')) {
              data.cell.styles.fillColor = [255, 243, 205];
              data.cell.styles.fontStyle = 'bold';
            }
          }
        }
      });

      doc.save('Station_loads.pdf');
    }

    function downloadExcel() {
      const wb = XLSX.utils.book_new();
      const sheet = XLSX.utils.table_to_sheet(document.getElementById('dataTable'));
      XLSX.utils.book_append_sheet(wb, sheet, 'ICTS Monthly Data');
      XLSX.writeFile(wb, 'station_loads.xlsx');
    }

    function toggleWhatsAppOptions(show) {
      const options = document.getElementById('whatsappOptions');
      options.style.display = show ? 'flex' : 'none';
    }

    function isMobileView() {
      return window.innerWidth <= 768;
    }

    function showWhatsAppButton() {
      const whatsappFloat = document.getElementById('whatsappFloat');
      if (isMobileView() && monthlyData.length > 0) {
        whatsappFloat.style.display = 'block';
      }
    }

    function hideWhatsAppButton() {
      const whatsappFloat = document.getElementById('whatsappFloat');
      whatsappFloat.style.display = 'none';
      toggleWhatsAppOptions(false);
    }

    function generateAndSharePDF() {
      if (!window.jspdf || !window.jspdf.jsPDF) {
        alert('jsPDF library failed to load. Please check your internet connection and try again.');
        return;
      }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.addImage('logo_new.png', 'PNG', 14, 10, 30, 30);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(14);
      doc.text("TRANSMISSION CORPORATION OF TELANGANA LIMITED", 48, 20);

      const dynamicTitle = `ICTS Monthly MAX MW from ${formatDate(selectedFromDate)} to ${formatDate(selectedToDate)}`;
      const pageWidth = doc.internal.pageSize.getWidth();
      doc.setFont("helvetica", "normal");
      doc.setFontSize(10);
      const titleWidth = doc.getTextWidth(dynamicTitle);
      const titleX = (pageWidth - titleWidth) / 2;

      const tableStartY = 35;
      doc.text(dynamicTitle, titleX, tableStartY - 2);

      doc.autoTable({
        html: '#dataTable',
        startY: tableStartY,
        theme: "grid",
        headStyles: { fontSize: 11, fillColor: [44, 62, 80], textColor: 255 },
        bodyStyles: { fontSize: 10 },
        columnStyles: {
          0: { cellWidth: 20 },
          1: { cellWidth: 40 },
          2: { cellWidth: 25 },
          3: { cellWidth: 30 },
          4: { cellWidth: 20 }
        },
        alternateRowStyles: { fillColor: [248, 249, 250] },
        didParseCell: function(data) {
          if (data.section === 'body') {
            const tableBody = document.querySelector('#dataTable tbody');
            const rows = Array.from(tableBody.getElementsByTagName('tr'));
            const rowIndex = data.row.index;
            if (rows[rowIndex] && rows[rowIndex].classList.contains('max-row')) {
              data.cell.styles.fillColor = [255, 243, 205];
              data.cell.styles.fontStyle = 'bold';
            }
          }
        }
      });

      const pdfBlob = doc.output('blob');
      const file = new File([pdfBlob], 'Station_loads.pdf', { type: 'application/pdf' });
      shareViaWhatsApp(file);
    }

    function generateAndShareExcel() {
      const wb = XLSX.utils.book_new();
      const sheet = XLSX.utils.table_to_sheet(document.getElementById('dataTable'));
      XLSX.utils.book_append_sheet(wb, sheet, 'ICTS Monthly Data');
      const excelBuffer = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
      const excelBlob = new Blob([excelBuffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const file = new File([excelBlob], 'station_loads.xlsx', { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      shareViaWhatsApp(file);
    }

    function shareViaWhatsApp(file) {
      if (navigator.share && isMobileView()) {
        navigator.share({
          files: [file],
          title: 'Station Loads Report',
          text: `Station Loads data from ${formatDate(selectedFromDate)} to ${formatDate(selectedToDate)}`
        })
        .then(() => toggleWhatsAppOptions(false))
        .catch(error => {
          console.error('Error sharing:', error);
          alert('Error sharing file. Please try again.');
        });
      } else {
        alert('Web Share API not supported on this device/browser.');
      }
    }
  </script>
</body>
</html>
