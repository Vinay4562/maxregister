<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICTS Monthly MAX MW Data</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.4/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.17/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="newdataCSS.css">
  <style>
    #dataTable {
      width: 90%;
      margin: 20px auto;
      border-collapse: collapse;
      font-family: 'Arial', sans-serif;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    #dataTable th, #dataTable td {
      padding: 12px 15px;
      text-align: center;
      border: 1px solid #e0e0e0;
    }
    #dataTable th {
      background-color: #2c3e50;
      color: white;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    #dataTable tr:nth-child(even) {
      background-color: #f8f9fa;
    }
    #dataTable tr:nth-child(odd) {
      background-color: #ffffff;
    }
    #dataTable tr:hover:not(thead tr) {
      background-color: #eef2f7;
      transition: background-color 0.2s;
    }
    #dataTable tr.max-row {
      background-color: #fff3cd !important; /* Light yellow for max value */
      font-weight: bold;
    }
    .chart-container {
      width: 90%;
      margin: 20px auto;
      height: 400px;
    }
    .data-container h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 20px;
      font-family: 'Arial', sans-serif;
    }
    .buttons {
      text-align: center;
      margin: 20px 0;
    }
    .buttons button {
      padding: 10px 20px;
      margin: 0 10px;
      background-color: #2c3e50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    .buttons button:hover {
      background-color: #34495e;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-content">
      <img src="logo_new.png" alt="Logo" width="60px" height="60px">
      <h1>𝐓𝐑𝐀𝐍𝐒𝐌𝐈𝐒𝐒𝐈𝐎𝐍 𝐂𝐎𝐑𝐏𝐎𝐑𝐀𝐓𝐈𝐎𝐍 𝐎𝐅 𝐓𝐄𝐋𝐀𝐍𝐆𝐀𝐍𝐀 𝐋𝐈𝐌𝐈𝐓�{E𝐃</h1>
      <button class="hamburger" id="hamburgerBtn">☰</button>
    </div>
  </div>
  <nav class="navbar" id="navbarMenu">
    <ul>
      <li><a href="https://400kvssshankarpally.free.nf/">Home</a></li>
      <li><a href="https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/LCbox_retrieve.html">MRT Schedules</a></li>
    </ul>
  </nav>

  <div class="container">
    <h2>ICTS Monthly MAX MW Data</h2>
    <form id="dateForm">
      <div class="form-item">
        <label for="fromDate">From Date:</label>
        <input type="date" id="fromDate" name="fromDate">
      </div>
      <div class="form-item">
        <label for="toDate">To Date:</label>
        <input type="date" id="toDate" name="toDate">
      </div>
      <div class="form-item">
        <input type="submit" value="Get Monthly Data">
      </div>
    </form>
  </div>

  <div id="fullScreenSpinner" style="display: none;">
    <div class="spinner"></div>
    <p>Loading data...</p>
  </div>

  <div class="data-container" id="dataContainer" style="display: none;">
    <h2 id="dataHeader"></h2>
    <table id="dataTable">
      <thead>
        <tr>
          <th>Serial No.</th>
          <th>Month</th>
          <th>Combined ICTS Feeders</th>
          <th>MAX MW</th>
          <th>Date</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="buttons">
      <button id="downloadPDFButton">Download as PDF</button>
      <button id="downloadExcelButton">Download as Excel</button>
    </div>
    <div class="chart-container">
      <canvas id="mwChart"></canvas>
    </div>
  </div>

  <script>
    const ICTS_FEEDERS = ['315MVA ICT-1', '315MVA ICT-2', '315MVA ICT-3', '500MVA ICT-4'];

    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('dateForm');
      form.addEventListener('submit', async function(event) {
        event.preventDefault();
        const spinner = document.getElementById('fullScreenSpinner');
        spinner.style.display = 'flex';

        const fromDate = document.getElementById('fromDate').value;
        const toDate = document.getElementById('toDate').value;

        if (!fromDate || !toDate) {
          alert('Please select both From Date and To Date.');
          spinner.style.display = 'none';
          return;
        }

        if (new Date(fromDate) > new Date(toDate)) {
          alert('From Date cannot be later than To Date.');
          spinner.style.display = 'none';
          return;
        }

        try {
          const monthlyData = await fetchMonthlyICTSData(fromDate, toDate);
          displayMonthlyData(monthlyData, fromDate, toDate);
          renderChart(monthlyData);
          document.getElementById('dataContainer').style.display = 'block';
        } catch (error) {
          console.error('Error fetching monthly data:', error);
          alert('Failed to fetch data. Please try again.');
        } finally {
          spinner.style.display = 'none';
        }
      });

      // Hamburger menu functionality
      const hamburgerBtn = document.getElementById('hamburgerBtn');
      const navbarMenu = document.getElementById('navbarMenu');
      const body = document.body;

      hamburgerBtn.addEventListener('click', function() {
        navbarMenu.classList.toggle('active');
        body.classList.toggle('navbar-open');
      });

      navbarMenu.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', function() {
          navbarMenu.classList.remove('active');
          body.classList.remove('navbar-open');
        });
      });

      document.addEventListener('click', function(event) {
        if (!navbarMenu.contains(event.target) && !hamburgerBtn.contains(event.target) && navbarMenu.classList.contains('active')) {
          navbarMenu.classList.remove('active');
          body.classList.remove('navbar-open');
        }
      });

      // Download buttons
      document.getElementById('downloadPDFButton').addEventListener('click', downloadPDF);
      document.getElementById('downloadExcelButton').addEventListener('click', downloadExcel);
    });

    async function fetchMonthlyICTSData(fromDate, toDate) {
      const start = new Date(fromDate);
      const end = new Date(toDate);
      const months = getMonthsBetween(start, end);

      const promises = ICTS_FEEDERS.map(feeder =>
        fetch(`https://maxregister-git-main-vinay-kumars-projects-f1559f4a.vercel.app/data-by-date?feeder=${feeder}&fromDate=${fromDate}&toDate=${toDate}`)
          .then(response => {
            if (!response.ok) throw new Error(`Failed to fetch data for ${feeder}`);
            return response.json();
          })
      );

      const allData = await Promise.all(promises);
      const combinedByDateTime = {};

      // Aggregate data by date and time
      allData.forEach((feederData) => {
        feederData.forEach(entry => {
          const key = `${entry.date} ${entry.time}`;
          if (!combinedByDateTime[key]) {
            combinedByDateTime[key] = { date: entry.date, time: entry.time, mwSum: 0, count: 0 };
          }
          combinedByDateTime[key].mwSum += Number(entry.MW);
          combinedByDateTime[key].count += 1;
        });
      });

      // Calculate max MW for each month
      const monthlyMax = {};
      for (const key in combinedByDateTime) {
        const entry = combinedByDateTime[key];
        if (entry.count !== ICTS_FEEDERS.length) continue;

        const date = new Date(entry.date);
        const monthKey = `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}`;
        if (!monthlyMax[monthKey] || entry.mwSum > monthlyMax[monthKey].mwSum) {
          monthlyMax[monthKey] = { mwSum: entry.mwSum, date: entry.date, time: entry.time };
        }
      }

      // Return data for each month in the range
      return months.map(month => {
        const monthKey = `${month.year}-${month.month}`;
        return monthlyMax[monthKey] ? {
          month: `${getMonthName(Number(month.month))} ${month.year}`,
          combinedMW: Math.round(monthlyMax[monthKey].mwSum),
          date: monthlyMax[monthKey].date,
          time: monthlyMax[monthKey].time
        } : {
          month: `${getMonthName(Number(month.month))} ${month.year}`,
          combinedMW: 'N/A',
          date: 'N/A',
          time: 'N/A'
        };
      });
    }

    function getMonthsBetween(start, end) {
      const months = [];
      let current = new Date(start);
      current.setDate(1);

      while (current <= end) {
        months.push({
          year: current.getFullYear(),
          month: (current.getMonth() + 1).toString().padStart(2, '0')
        });
        current.setMonth(current.getMonth() + 1);
      }
      return months;
    }

    function getMonthName(monthNumber) {
      const monthNames = [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'
      ];
      return monthNames[monthNumber - 1];
    }

    function displayMonthlyData(data, fromDate, toDate) {
      const tableBody = document.querySelector('#dataTable tbody');
      tableBody.innerHTML = '';
      const dataHeader = document.getElementById('dataHeader');
      dataHeader.textContent = `ICTS Monthly MAX MW From: ${formatDate(fromDate)} To: ${formatDate(toDate)}`;

      // Find the maximum MW value across all months
      const maxMW = Math.max(...data.map(entry => entry.combinedMW === 'N/A' ? -Infinity : entry.combinedMW));

      data.forEach((entry, index) => {
        const row = document.createElement('tr');
        if (entry.combinedMW === maxMW) {
          row.classList.add('max-row'); // Use class instead of inline style
        }
        row.innerHTML = `
          <td>${index + 1}</td>
          <td>${entry.month}</td>
          <td>${ICTS_FEEDERS.join(', ')}</td>
          <td>${entry.combinedMW}</td>
          <td>${entry.combinedMW === 'N/A' ? 'N/A' : formatDate(entry.date)}</td>
          <td>${entry.time}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    function renderChart(data) {
      const ctx = document.getElementById('mwChart').getContext('2d');
      if (window.mwChartInstance) {
        window.mwChartInstance.destroy();
      }

      const labels = data.map(entry => entry.month);
      const mwValues = data.map(entry => entry.combinedMW === 'N/A' ? null : entry.combinedMW);

      window.mwChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Monthly MAX MW',
            data: mwValues,
            borderColor: '#3498db',
            backgroundColor: 'rgba(52, 152, 219, 0.2)',
            borderWidth: 2,
            pointRadius: 4,
            fill: false,
            tension: 0.1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { title: { display: true, text: 'Month' } },
            y: { title: { display: true, text: 'MW' }, beginAtZero: true }
          },
          plugins: {
            tooltip: { mode: 'index', intersect: false },
            legend: { display: true }
          }
        }
      });
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      const day = date.getDate().toString().padStart(2, '0');
      const month = (date.getMonth() + 1).toString().padStart(2, '0');
      const year = date.getFullYear();
      return `${day}-${month}-${year}`;
    }

    function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.addImage('logo_new.png', 'PNG', 14, 10, 30, 30);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(14);
      doc.text("TRANSMISSION CORPORATION OF TELANGANA LIMITED", 48, 20);

      const fromDate = document.getElementById('fromDate').value;
      const toDate = document.getElementById('toDate').value;
      const dynamicTitle = `ICTS Monthly MAX MW from ${formatDate(fromDate)} to ${formatDate(toDate)}`;

      const pageWidth = doc.internal.pageSize.getWidth();
      doc.setFont("helvetica", "normal");
      doc.setFontSize(10);
      const titleWidth = doc.getTextWidth(dynamicTitle);
      const titleX = (pageWidth - titleWidth) / 2;

      const tableStartY = 35;
      doc.text(dynamicTitle, titleX, tableStartY - 2);

      doc.autoTable({
        html: '#dataTable',
        startY: tableStartY,
        theme: "grid",
        headStyles: { 
          fontSize: 10,
          fillColor: [44, 62, 80], // Matches #2c3e50
          textColor: 255
        },
        bodyStyles: { fontSize: 9 },
        alternateRowStyles: { fillColor: [248, 249, 250] }, // Matches #f8f9fa
        didParseCell: function(data) {
          if (data.section === 'body') {
            const tableBody = document.querySelector('#dataTable tbody');
            const rows = Array.from(tableBody.getElementsByTagName('tr'));
            const rowIndex = data.row.index;
            if (rows[rowIndex] && rows[rowIndex].classList.contains('max-row')) {
              data.cell.styles.fillColor = [255, 243, 205]; // Matches #fff3cd
              data.cell.styles.fontStyle = 'bold';
            }
          }
        }
      });

      doc.save('icts_monthly_max_mw.pdf');
    }

    function downloadExcel() {
      const wb = XLSX.utils.book_new();
      const sheet = XLSX.utils.table_to_sheet(document.getElementById('dataTable'));
      XLSX.utils.book_append_sheet(wb, sheet, 'ICTS Monthly Data');
      XLSX.writeFile(wb, 'icts_monthly_max_mw.xlsx');
    }
  </script>
</body>
</html>
