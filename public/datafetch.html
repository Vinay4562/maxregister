<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fetch Data by Date Range</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .input-group {
      margin-bottom: 20px;
    }
    .input-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .input-group select, .input-group input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #f2f2f2;
      font-weight: bold;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    tr:hover {
      background-color: #f1f1f1;
    }
    .no-data {
      text-align: center;
      padding: 20px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Fetch Data by Date Range</h1>
    <form id="fetchForm">
      <div class="input-group">
        <label for="voltageLevel">Voltage Level:</label>
        <select id="voltageLevel" name="voltageLevel" required>
          <option value="">Select Voltage Level</option>
          <option value="400KV">400KV</option>
          <option value="220KV">220KV</option>
          <option value="ICTS">ICT'S</option>
        </select>
      </div>
      <div class="input-group">
        <label for="feeder">Feeder/ICT:</label>
        <select id="feeder" name="feeder" required>
          <option value="">Select Feeder/ICT</option>
          <!-- Options will be populated dynamically -->
        </select>
      </div>
      <div class="input-group">
        <label for="startMonth">From Month:</label>
        <select id="startMonth" name="startMonth" required>
          <option value="">Select Month</option>
          <option value="01">January</option>
          <option value="02">February</option>
          <option value="03">March</option>
          <option value="04">April</option>
          <option value="05">May</option>
          <option value="06">June</option>
          <option value="07">July</option>
          <option value="08">August</option>
          <option value="09">September</option>
          <option value="10">October</option>
          <option value="11">November</option>
          <option value="12">December</option>
        </select>
      </div>
      <div class="input-group">
        <label for="startYear">From Year:</label>
        <select id="startYear" name="startYear" required>
          <option value="">Select Year</option>
          <!-- Options will be populated dynamically -->
        </select>
      </div>
      <div class="input-group">
        <label for="endMonth">To Month:</label>
        <select id="endMonth" name="endMonth" required>
          <option value="">Select Month</option>
          <option value="01">January</option>
          <option value="02">February</option>
          <option value="03">March</option>
          <option value="04">April</option>
          <option value="05">May</option>
          <option value="06">June</option>
          <option value="07">July</option>
          <option value="08">August</option>
          <option value="09">September</option>
          <option value="10">October</option>
          <option value="11">November</option>
          <option value="12">December</option>
        </select>
      </div>
      <div class="input-group">
        <label for="endYear">To Year:</label>
        <select id="endYear" name="endYear" required>
          <option value="">Select Year</option>
          <!-- Options will be populated dynamically -->
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Fetch Data</button>
    </form>

    <div id="dataContainer" style="display: none;">
      <h2>Fetched Data</h2>
      <table id="dataTable">
        <thead>
          <tr>
            <th>Serial No.</th>
            <th>Feeder/ICT</th>
            <th>MW</th>
            <th>Date</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div id="noDataMessage" class="no-data">No data available for the selected criteria.</div>
    </div>
  </div>

  <script>
    // Populate year dropdowns
    const startYearSelect = document.getElementById('startYear');
    const endYearSelect = document.getElementById('endYear');
    const currentYear = new Date().getFullYear();
    for (let year = 2012; year <= currentYear; year++) {
      const option = document.createElement('option');
      option.value = year;
      option.textContent = year;
      startYearSelect.appendChild(option.cloneNode(true));
      endYearSelect.appendChild(option);
    }

    // Populate feeder dropdown based on voltage level
    document.getElementById('voltageLevel').addEventListener('change', function() {
      const voltageLevel = this.value;
      const feederSelect = document.getElementById('feeder');
      feederSelect.innerHTML = '<option value="">Select Feeder/ICT</option>';

      if (voltageLevel === '400KV') {
        const feeders = ['400KV MAHESHWARAM-2', '400KV MAHESHWARAM-1', '400KV NARSAPUR-1', '400KV NARSAPUR-2', '400KV KETHIREDDYPALLY-1', '400KV KETHIREDDYPALLY-2', '400KV NIZAMABAD-1', '400KV NIZAMABAD-2'];
        feeders.forEach(feeder => {
          const option = document.createElement('option');
          option.value = feeder;
          option.textContent = feeder;
          feederSelect.appendChild(option);
        });
      } else if (voltageLevel === '220KV') {
        const feeders = ['220KV PARIGI-1', '220KV PARIGI-2', '220KV TANDUR', '220KV GACHIBOWLI-1', '220KV GACHIBOWLI-2', '220KV KETHIREDDYPALLY', '220KV YEDDUMAILARAM-1', '220KV YEDDUMAILARAM-2', '220KV SADASIVAPET-1', '220KV SADASIVAPET-2'];
        feeders.forEach(feeder => {
          const option = document.createElement('option');
          option.value = feeder;
          option.textContent = feeder;
          feederSelect.appendChild(option);
        });
      } else if (voltageLevel === 'ICTS') {
        const feeders = ['315MVA ICT-1', '315MVA ICT-2', '315MVA ICT-3', '500MVA ICT-4'];
        feeders.forEach(feeder => {
          const option = document.createElement('option');
          option.value = feeder;
          option.textContent = feeder;
          feederSelect.appendChild(option);
        });
      }
    });

    // Fetch data on form submission
    document.getElementById('fetchForm').addEventListener('submit', async function(event) {
      event.preventDefault();

      const voltageLevel = document.getElementById('voltageLevel').value;
      const feeder = document.getElementById('feeder').value;
      const startMonth = document.getElementById('startMonth').value;
      const startYear = document.getElementById('startYear').value;
      const endMonth = document.getElementById('endMonth').value;
      const endYear = document.getElementById('endYear').value;

      if (!voltageLevel || !feeder || !startMonth || !startYear || !endMonth || !endYear) {
        alert('Please fill all fields.');
        return;
      }

      try {
        const response = await fetch(
          `https://maxregister-git-main-vinay-kumars-projects-f1559f4a.vercel.app/fetchData?voltageLevel=${voltageLevel}&feeder=${feeder}&startMonth=${startMonth}&startYear=${startYear}&endMonth=${endMonth}&endYear=${endYear}`
        );
        const data = await response.json();

        const tableBody = document.querySelector('#dataTable tbody');
        tableBody.innerHTML = ''; // Clear previous data

        if (data.length > 0) {
          data.forEach((item, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
              <td>${index + 1}</td>
              <td>${feeder}</td>
              <td>${item.MW}</td>
              <td>${item.date}</td>
              <td>${item.time}</td>
            `;
            tableBody.appendChild(row);
          });
          document.getElementById('noDataMessage').style.display = 'none';
        } else {
          document.getElementById('noDataMessage').style.display = 'block';
        }

        document.getElementById('dataContainer').style.display = 'block';
      } catch (error) {
        console.error('Error fetching data:', error);
        alert('An error occurred while fetching data. Please try again.');
      }
    });
  </script>
</body>
</html>
