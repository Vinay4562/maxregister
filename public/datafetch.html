<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Data by Year</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h2>Fetch Data</h2>
    <label for="voltage">Select Voltage Level:</label>
    <select id="voltage">
        <option value="400kV">400kV</option>
        <option value="220kV">220kV</option>
        <option value="ICTs">ICTs</option>
    </select>
    
    <label for="feeder">Select Feeder:</label>
    <select id="feeder"></select>
    
    <label for="fromMonth">From Month:</label>
    <select id="fromMonth"></select>
    
    <label for="fromYear">From Year:</label>
    <select id="fromYear"></select>
    
    <label for="toMonth">To Month:</label>
    <select id="toMonth"></select>
    
    <label for="toYear">To Year:</label>
    <select id="toYear"></select>
    
    <button onclick="fetchData()">Get Data</button>
    
    <table border="1">
        <thead>
            <tr>
                <th>Voltage</th>
                <th>Feeder</th>
                <th>Year</th>
                <th>Month</th>
                <th>MW</th>
                <th>Date</th>
                <th>Time</th>
            </tr>
        </thead>
        <tbody id="dataTable"></tbody>
    </table>

    <script>
        const feeders = {
            "400kV": ["400KV MAHESHWARAM-2", "400KV MAHESHWARAM-1", "400KV NARSAPUR-1", "400KV NARSAPUR-2"],
            "220kV": ["220KV PARIGI-1", "220KV PARIGI-2", "220KV THANDUR"],
            "ICTs": ["315MVA ICT-1", "315MVA ICT-2"]
        };

        function populateDropdowns() {
            for (let i = 1; i <= 12; i++) {
                $("#fromMonth, #toMonth").append(new Option(i, i));
            }
            for (let i = 2012; i <= 2024; i++) {
                $("#fromYear, #toYear").append(new Option(i, i));
            }
        }

        $("#voltage").change(function () {
            let selectedVoltage = $(this).val();
            $("#feeder").empty();
            feeders[selectedVoltage].forEach(feeder => {
                $("#feeder").append(new Option(feeder, feeder));
            });
        });

        function fetchData() {
    let voltage = $("#voltage").val();
    let feeder = $("#feeder").val();
    let fromMonth = parseInt($("#fromMonth").val(), 10);
    let fromYear = parseInt($("#fromYear").val(), 10);
    let toMonth = parseInt($("#toMonth").val(), 10);
    let toYear = parseInt($("#toYear").val(), 10);

    // Check if any required parameter is missing
    if (!voltage || !feeder || !fromMonth || !fromYear || !toMonth || !toYear) {
        alert("Please select all required fields.");
        return;
    }

    let apiUrl = `https://maxregister-git-main-vinay-kumars-projects-f1559f4a.vercel.app/data?voltage=${voltage}&feeder=${feeder}&fromMonth=${fromMonth}&fromYear=${fromYear}&toMonth=${toMonth}&toYear=${toYear}`;

    $.get(apiUrl, function (data) {
        $("#dataTable").empty(); // Clear previous data

        let filteredData = data.filter(row => {
            let rowDate = new Date(row.date);
            let rowMonth = rowDate.getMonth() + 1; // JS months are 0-based
            let rowYear = rowDate.getFullYear();

            return (rowYear > fromYear || (rowYear === fromYear && rowMonth >= fromMonth)) &&
                   (rowYear < toYear || (rowYear === toYear && rowMonth <= toMonth));
        });

        if (filteredData.length === 0) {
            $("#dataTable").append("<tr><td colspan='7'>No data found for the selected range.</td></tr>");
            return;
        }

        filteredData.forEach(row => {
            $("#dataTable").append(`
                <tr>
                    <td>${row.voltage}</td>
                    <td>${row.feeder}</td>
                    <td>${row.year}</td>
                    <td>${rowMonth}</td>
                    <td>${row.MW}</td>
                    <td>${row.date}</td>
                    <td>${row.time}</td>
                </tr>
            `);
        });
    }).fail(() => {
        $("#dataTable").append("<tr><td colspan='7'>Error fetching data. Please check API parameters.</td></tr>");
    });
}


        $(document).ready(function () {
            populateDropdowns();
            $("#voltage").trigger("change");
        });
    </script>
</body>
</html>
