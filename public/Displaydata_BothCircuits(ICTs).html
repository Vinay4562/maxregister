<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor Data at Multi circuits in service</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.4/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.17/jspdf.plugin.autotable.min.js"></script>
  <link rel="stylesheet" href="DisplaydataCSS(original).css">
  <link rel="stylesheet" href="DisplaydataICTS(original).css">

</head>
<body>
<!-- Header -->
<div class="header">
  <img src="logo_new.png" alt="Logo" class="logo" width="130px" height="100px">
  <h1>𝐓𝐑𝐀𝐍𝐒𝐌𝐈𝐒𝐒𝐈𝐎𝐍 𝐂𝐎𝐑𝐏𝐎𝐑𝐀𝐓𝐈𝐎𝐍 𝐎𝐅 𝐓𝐄𝐋𝐀𝐍𝐆𝐀𝐍𝐀 𝐋𝐈𝐌𝐈𝐓𝐄𝐃</h1>
</div>

<!-- Navigation bar -->
<div class="navbar">
  <a href="https://400kvssshankarpally.free.nf/">Home</a>
  <a href="https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/LCbox_retrieve.html" class="active">MRT Schedules</a>
</div>

  <div class="container">
    <h2>Loads on Multi Feeders/ICT's in Service</h2>
    <form id="selectForm">
      <div class="form-item">
        <label for="input1">Select Voltage:</label>
        <select name="input1" id="input1">
          <option value="">Select voltage</option>
          <option value="400KV">400KV</option>
          <option value="220KV">220KV</option>
          <option value="ICTS">ICTS</option>
        </select>
      </div>
      
      <div class="form-item hidden" id="input2Container">
        <label for="input2" id="input2Label">Select First Feeder/ICT:</label>
        <select name="input2" id="input2">
          <option value="">Select feeder</option>
        </select>
      </div>
      
      <div class="form-item hidden" id="input3Container">
        <label for="input3" id="input3Label">Select Second Feeder/ICT:</label>
        <select name="input3" id="input3">
          <option value="">Select feeder</option>
        </select>
      </div>
      
      <div class="form-item hidden" id="input4Container">
        <label for="input4" id="input4Label">Select Third Feeder/ICT:</label>
        <select name="input4" id="input4">
          <option value="">Select feeder</option>
        </select>
      </div>
      
      <div class="form-item hidden" id="input5Container">
        <label for="input5" id="input5Label">Select Fourth Feeder/ICT:</label>
        <select name="input5" id="input5">
          <option value="">Select feeder</option>
        </select>
      </div>
      <div class="form-item">
        <label for="year">Select Year:</label>
        <select name="year" id="year">
          <option value="">Select Year</option>
        </select>
      </div>
      <div class="form-item">
        <label for="toYear">To Year:</label>
        <select name="toYear" id="toYear">
          <option value="">To Year</option>
        </select>
      </div>
      <div class="form-item">
        <input type="submit" id="submitBtn" value="Submit">
      </div>
    </form>
  </div>

  <!-- Loading Spinner -->
  <div id="fullScreenSpinner" style="display: none;">
    <div class="spinner"></div>
    <p>Loading data...</p>
  </div>

  <div id="uploadedData" style="display: none;">
    <div id="tableTitle"></div>
    <h2>Uploaded Data</h2>
    <table id="dataTable">
      <thead>
        <tr>
          <th>Serial No.</th>
          <th>Name of the Feeder</th>
          <th>MW</th>
          <th>Date</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  
  <!-- Matched Data (Filtered Results) -->
  <div class="centered-table">
    <div id="matchedData" style="display: none;">
      <h2>Loads at same time of Feeders/ICT'S</h2>
      <table id="matchedTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Feeder 1</th>
                <th>MW</th>
                <th>Feeder 2</th>
                <th>MW</th>
                <th id="feeder3Header">Feeder 3</th>
                <th id="feeder3MWHeader">MW</th>
                <th id="feeder4Header">Feeder 4</th>
                <th id="feeder4MWHeader">MW</th>              
            </tr>
        </thead>
        <tbody></tbody>
    </table>  
  </div>
</div>
<button id="downloadPDFButton" style="display: none;">Download as PDF</button>
<button id="downloadExcelButton" style="display: none;">Download as Excel</button>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    // Populate year dropdowns
    const currentYear = new Date().getFullYear();
    const yearSelect = document.getElementById('year');
    const toYearSelect = document.getElementById('toYear');

    for (let year = 2012; year <= currentYear; year++) {
      const option = document.createElement('option');
      option.value = year;
      option.textContent = year;
      yearSelect.appendChild(option);

      const toYearOption = document.createElement('option');
      toYearOption.value = year;
      toYearOption.textContent = year;
      toYearSelect.appendChild(toYearOption);
    }

    // Helper function to add options to a dropdown
    function addOptions(selectElement, options) {
      options.forEach((option) => {
        const opt = document.createElement('option');
        opt.value = option;
        opt.textContent = option;
        selectElement.appendChild(opt);
      });
    }

    // Helper function to clear options in a dropdown
    function clearOptions(selectElement) {
      selectElement.innerHTML = '<option value="">Select feeder</option>';
    }

    // Function to set up feeder/ICT dropdowns based on voltage
    function setupVoltageOptions(voltage, feeders) {
      const input2 = document.getElementById('input2');
      const input3 = document.getElementById('input3');
      const input4 = document.getElementById('input4');
      const input5 = document.getElementById('input5');

      // Clear existing options
      clearOptions(input2);
      clearOptions(input3);
      clearOptions(input4);
      clearOptions(input5);

      // Add new options
      addOptions(input2, feeders);
      addOptions(input3, feeders);

      // Show/hide additional dropdowns based on voltage
      if (voltage === 'ICTS') {
        addOptions(input4, feeders);
        addOptions(input5, feeders);
        document.getElementById('input4Container').classList.add('visible');
        document.getElementById('input5Container').classList.add('visible');
      } else {
        document.getElementById('input4Container').classList.remove('visible');
        document.getElementById('input5Container').classList.remove('visible');
      }

      // Ensure the first two dropdowns are always visible
      document.getElementById('input2Container').classList.add('visible');
      document.getElementById('input3Container').classList.add('visible');
    }

    // Event listener for voltage selection
    document.getElementById('input1').addEventListener('change', function () {
      const voltage = this.value;

      // Set up feeder/ICT options based on selected voltage
      if (voltage === '400KV') {
        setupVoltageOptions(voltage, [
          '400KV MAHESHWARAM-2',
          '400KV MAHESHWARAM-1',
          '400KV NARSAPUR-1',
          '400KV NARSAPUR-2',
          '400KV KETHIREDDYPALLY-1',
          '400KV KETHIREDDYPALLY-2',
          '400KV NIZAMABAD-1',
          '400KV NIZAMABAD-2',
        ]);
      } else if (voltage === '220KV') {
        setupVoltageOptions(voltage, [
          '220KV PARIGI-1',
          '220KV PARIGI-2',
          '220KV TANDUR',
          '220KV GACHIBOWLI-1',
          '220KV GACHIBOWLI-2',
          '220KV KETHIREDDYPALLY',
          '220KV YEDDUMAILARAM-1',
          '220KV YEDDUMAILARAM-2',
          '220KV SADASIVAPET-1',
          '220KV SADASIVAPET-2',
        ]);
      } else if (voltage === 'ICTS') {
        setupVoltageOptions(voltage, [
          '315MVA ICT-1',
          '315MVA ICT-2',
          '315MVA ICT-3',
          '500MVA ICT-4',
        ]);
      } else {
        // Hide all feeder/ICT dropdowns if no valid voltage is selected
        document.getElementById('input2Container').classList.remove('visible');
        document.getElementById('input3Container').classList.remove('visible');
        document.getElementById('input4Container').classList.remove('visible');
        document.getElementById('input5Container').classList.remove('visible');
      }
    });

    document.getElementById('selectForm').addEventListener('submit', function(event) {
        event.preventDefault();

        document.getElementById('fullScreenSpinner').style.display = 'flex';

        const voltage = document.getElementById('input1').value;
        const feeder1 = document.getElementById('input2').value;
        const feeder2 = document.getElementById('input3').value;
        const feeder3 = document.getElementById('input4').value;
        const feeder4 = document.getElementById('input5').value;
        const year = document.getElementById('year').value;
        const toYear = document.getElementById('toYear').value;

        document.getElementById('downloadPDFButton').style.display = 'none';
        document.getElementById('downloadExcelButton').style.display = 'none';

        if (voltage === '400KV' || voltage === '220KV') {
            document.getElementById('feeder3Header').style.display = 'none';
            document.getElementById('feeder3MWHeader').style.display = 'none';
            document.getElementById('feeder4Header').style.display = 'none';
            document.getElementById('feeder4MWHeader').style.display = 'none';
        } else if (voltage === 'ICTS') {
            document.getElementById('feeder3Header').style.display = 'table-cell';
            document.getElementById('feeder3MWHeader').style.display = 'table-cell';
            document.getElementById('feeder4Header').style.display = 'table-cell';
            document.getElementById('feeder4MWHeader').style.display = 'table-cell';
        }

        if ((voltage === '400KV' || voltage === '220KV') && hasDuplicates([feeder1, feeder2])) {
            alert('Please select different feeders for each input.');
            document.getElementById('fullScreenSpinner').style.display = 'none';
            return;
        } else if (voltage === 'ICTS' && hasDuplicates([feeder1, feeder2, feeder3, feeder4])) {
            alert('Please select different feeders for each input.');
            document.getElementById('fullScreenSpinner').style.display = 'none';
            return;
        }

        if (!voltage || !feeder1 || !feeder2 || !year || !toYear) {
            alert('Please fill in all required fields.');
            document.getElementById('fullScreenSpinner').style.display = 'none';
            return;
        }

        const startYear = parseInt(year);
        const endYear = parseInt(toYear);

        fetchAndDisplayData(voltage, feeder1, feeder2, feeder3, feeder4, startYear, endYear)
            .catch(error => {
                console.error("Error fetching data:", error);
                alert("Failed to fetch data. Please try again.");
            })
            .finally(() => {
                document.getElementById('fullScreenSpinner').style.display = 'none';

                if (document.getElementById('dataTable').rows.length > 1) {
                    document.getElementById('input1').value = '';
                    document.getElementById('input2').value = '';
                    document.getElementById('input3').value = '';
                    document.getElementById('input4').value = '';
                    document.getElementById('input5').value = '';
                    document.getElementById('year').value = '';
                    document.getElementById('toYear').value = '';

                    document.getElementById('downloadPDFButton').style.display = 'inline-block';
                    document.getElementById('downloadExcelButton').style.display = 'inline-block';
                }
            });
    });

    // Function to check for duplicate values
    function hasDuplicates(arr) {
        let uniqueValues = new Set(arr.filter(item => item !== "")); // Remove empty selections
        return uniqueValues.size !== arr.filter(item => item !== "").length;
    }

    async function fetchAndDisplayData(voltage, feeder1, feeder2, feeder3, feeder4, startYear, endYear) {
      const uploadedTableBody = document.querySelector('#dataTable tbody');
      const matchedTableBody = document.querySelector('#matchedTable tbody');

      // Clear previous data
      uploadedTableBody.innerHTML = '';
      matchedTableBody.innerHTML = '';

      // Show both sections
      document.getElementById('uploadedData').style.display = 'block';
      document.getElementById('matchedData').style.display = 'block';

      try {
          // Fetch data for all selected feeders
          const feeder1Data = feeder1 ? await fetchDataForFeeder(feeder1, startYear, endYear) : [];
          const feeder2Data = feeder2 ? await fetchDataForFeeder(feeder2, startYear, endYear) : [];
          const feeder3Data = voltage === 'ICTS' && feeder3 ? await fetchDataForFeeder(feeder3, startYear, endYear) : [];
          const feeder4Data = voltage === 'ICTS' && feeder4 ? await fetchDataForFeeder(feeder4, startYear, endYear) : [];

          // Combine and sort data
          const allData = [...feeder1Data, ...feeder2Data, ...feeder3Data, ...feeder4Data];
          allData.sort((a, b) => new Date(a.date + ' ' + a.time) - new Date(b.date + ' ' + b.time));

          // Populate uploaded data table
          populateUploadedTable(uploadedTableBody, allData);

          // Find matched rows
          const matchedRows = findMatchedRows(voltage, feeder1Data, feeder2Data, feeder3Data, feeder4Data);

          // Display matched rows
          displayMaxMWRow(matchedTableBody, matchedRows, voltage, feeder1, feeder2, feeder3, feeder4, startYear, endYear);
      } catch (error) {
          console.error('Error fetching or displaying data:', error);
          alert("Failed to fetch data. Please try again.");
      }
  }

  function populateUploadedTable(tableBody, data) {
      if (data.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: red;">No data found for the selected period.</td></tr>`;
          return;
      }

      data.forEach((item, index) => {
          const row = document.createElement('tr');
          row.innerHTML = `
              <td>${index + 1}</td>
              <td>${item.feeder}</td>
              <td>${Math.round(Number(item.MW))}</td>
              <td>${formatDate(item.date)}</td>
              <td>${item.time}</td>
          `;
          tableBody.appendChild(row);
      });
  }

  function findMatchedRows(voltage, feeder1Data, feeder2Data, feeder3Data, feeder4Data) {
      let matchedRows = [];

      if (voltage !== 'ICTS') {
          // Matching for normal feeders
          for (let i = 0; i < feeder1Data.length; i++) {
              const item1 = feeder1Data[i];
              for (let j = 0; j < feeder2Data.length; j++) {
                  const item2 = feeder2Data[j];
                  if (item1.date === item2.date && item1.time === item2.time) {
                      matchedRows.push({
                          date: item1.date,
                          time: item1.time,
                          feeder1: item1,
                          feeder2: item2
                      });
                  }
              }
          }
      } else {
          // Matching for ICTS feeders
          for (let i = 0; i < feeder1Data.length; i++) {
              const item1 = feeder1Data[i];
              for (let j = 0; j < feeder2Data.length; j++) {
                  const item2 = feeder2Data[j];
                  if (item1.date === item2.date && item1.time === item2.time) {
                      for (let k = 0; k < feeder3Data.length; k++) {
                          const item3 = feeder3Data[k];
                          if (item1.date === item3.date && item1.time === item3.time) {
                              for (let l = 0; l < feeder4Data.length; l++) {
                                  const item4 = feeder4Data[l];
                                  if (item1.date === item4.date && item1.time === item4.time) {
                                      matchedRows.push({
                                          date: item1.date,
                                          time: item1.time,
                                          feeder1: item1,
                                          feeder2: item2,
                                          feeder3: item3,
                                          feeder4: item4
                                      });
                                  }
                              }
                          }
                      }
                  }
              }
          }
      }

      return matchedRows;
  }

  function displayMaxMWRow(tableBody, matchedRows, voltage, feeder1, feeder2, feeder3, feeder4, startYear, endYear) {
      if (matchedRows.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: red;">No matching records found.</td></tr>`;
          return;
      }

      // Find the row with the highest MW sum
      let maxMW = -Infinity;
      let maxMWRow = null;

      matchedRows.forEach(row => {
          let totalMW = Math.round(Number(row.feeder1.MW)) + Math.round(Number(row.feeder2.MW));
          if (row.feeder3) totalMW += Math.round(Number(row.feeder3.MW));
          if (row.feeder4) totalMW += Math.round(Number(row.feeder4.MW));

          if (totalMW > maxMW) {
              maxMW = totalMW;
              maxMWRow = row;
          }
      });

      // Dynamically create table header based on voltage type
      const tableHeader = document.querySelector('#matchedTable thead');
      tableHeader.innerHTML = '';

      let headerHTML = `
          <th>Date</th>
          <th>Time</th>
          <th>${feeder1}</th>
          <th>MW</th>
          <th>${feeder2}</th>
          <th>MW</th>
      `;

      if (voltage === 'ICTS') {
          headerHTML += `
              <th>${feeder3}</th>
              <th>MW</th>
              <th>${feeder4}</th>
              <th>MW</th>
          `;
      }

      tableHeader.innerHTML = headerHTML;

      // Set the table title
      const tableTitle = document.querySelector('#tableTitle');
      if (voltage === 'ICTS') {
          tableTitle.innerHTML = `Maximum MW of ${feeder1}, ${feeder2}, ${feeder3}, and ${feeder4} from ${startYear} to ${endYear}`;
      } else {
          tableTitle.innerHTML = `Maximum MW of ${feeder1} and ${feeder2} from ${startYear} to ${endYear}`;
      }

      // Display the row with the highest MW
      if (maxMWRow) {
          const tableRow = document.createElement('tr');
          let rowHTML = `
              <td>${formatDate(maxMWRow.date)}</td>
              <td>${maxMWRow.time}</td>
              <td>${feeder1}</td>
              <td>${Math.round(Number(maxMWRow.feeder1.MW))}</td>
              <td>${feeder2}</td>
              <td>${Math.round(Number(maxMWRow.feeder2.MW))}</td>
          `;

          if (voltage === 'ICTS') {
              rowHTML += `
                  <td>${feeder3}</td>
                  <td>${maxMWRow.feeder3 ? Math.round(Number(maxMWRow.feeder3.MW)) : '-'}</td>
                  <td>${feeder4}</td>
                  <td>${maxMWRow.feeder4 ? Math.round(Number(maxMWRow.feeder4.MW)) : '-'}</td>
              `;
          }

          tableRow.innerHTML = rowHTML;
          tableBody.appendChild(tableRow);
          tableRow.classList.add('highlight');
    }

    document.getElementById('downloadPDFButton').addEventListener('click', function () {
        const { jsPDF } = window.jspdf;  // Get jsPDF from the window object
        const doc = new jsPDF();         // Create a new jsPDF instance

        // Add Logo to PDF (assumes logo_new.png is accessible)
        doc.addImage('logo_new.png', 'PNG', 14, 10, 30, 30);  // x, y, width, height

        // Add custom header text
        doc.setFont("helvetica", "bold");
        doc.setFontSize(16);
        doc.text("TRANSMISSION CORPORATION OF TELANGANA LIMITED", 60, 20);  // Adjust x, y position of the text

        // Set font for the rest of the content
        doc.setFont("helvetica", "normal");
        doc.setFontSize(12);

        // Get tables for uploaded and matched data
        const uploadedTable = document.getElementById('dataTable');
        const matchedTable = document.getElementById('matchedTable');

        // Add title for uploaded data
        doc.text("Uploaded Data", 14, 40);
        doc.autoTable({
            html: uploadedTable,
            startY: 50,
            theme: "grid",
            headStyles: { fontSize: 10 },
            bodyStyles: { fontSize: 9 },
        });

        // Add a new page for matched data
        doc.addPage();

        // Add title for matched data
        doc.text("Matched Data", 14, 20);
        doc.autoTable({
            html: matchedTable,
            startY: 30,
            theme: "grid",
            headStyles: { fontSize: 10 },
            bodyStyles: { fontSize: 9 },
        });

        // Save the PDF with the name 'data.pdf'
        doc.save('data.pdf');
    });

    document.getElementById('downloadExcelButton').addEventListener('click', function () {
        // Get tables for uploaded and matched data
        const uploadedTable = document.getElementById('dataTable');
        const matchedTable = document.getElementById('matchedTable');

        // Convert HTML tables to Excel format using xlsx
        const wb = XLSX.utils.book_new();  // Create a new workbook

        // Create worksheets for both tables
        const uploadedSheet = XLSX.utils.table_to_sheet(uploadedTable);
        const matchedSheet = XLSX.utils.table_to_sheet(matchedTable);

        // Append worksheets to the workbook
        XLSX.utils.book_append_sheet(wb, uploadedSheet, 'Uploaded Data');
        XLSX.utils.book_append_sheet(wb, matchedSheet, 'Matched Data');

        // Export the workbook as Excel
        XLSX.writeFile(wb, 'data.xlsx');
    });
}

function updateTableHeaders() {
    const voltageLevel = document.getElementById("voltageLevel").value; // Adjust this ID based on your form
    const feeder3Header = document.getElementById("feeder3Header");
    const feeder4Header = document.getElementById("feeder4Header");
    const feeder3MWHeader = document.getElementById("feeder3MWHeader");
    const feeder4MWHeader = document.getElementById("feeder4MWHeader");

    if (voltageLevel === "400KV" || voltageLevel === "220KV") {
        // Hide Feeder 3 & Feeder 4 headers
        feeder3Header.style.display = "none";
        feeder4Header.style.display = "none";
        feeder3MWHeader.style.display = "none";
        feeder4MWHeader.style.display = "none";
    } else {
        // Show Feeder 3 & Feeder 4 headers when ICTs are selected
        feeder3Header.style.display = "table-cell";
        feeder4Header.style.display = "table-cell";
        feeder3MWHeader.style.display = "table-cell";
        feeder4MWHeader.style.display = "table-cell";
    }
}

// Call function on voltage level change
document.getElementById("voltageLevel").addEventListener("change", updateTableHeaders);

// Call function on page load
window.onload = updateTableHeaders;

async function fetchDataForFeeder(feeder, startYear, endYear) {
    let fetchedData = [];
    for (let year = startYear; year <= endYear; year++) {
        try {
            const data = await fetch(`https://maxregister-git-main-vinay-kumars-projects-f1559f4a.vercel.app/data?feeder=${feeder}&year=${year}`).then(response => response.json());
            fetchedData = fetchedData.concat(data);
        } catch (error) {
            console.error('Error fetching data:', error);
        }
    }
    return fetchedData;
}

function formatDate(dateString) {
    const date = new Date(dateString);
    const day = date.getDate().toString().padStart(2, '0');
    const month = (date.getMonth() + 1).toString().padStart(2, '0');
    const year = date.getFullYear();
    return `${day}-${month}-${year}`;
}

  function filterAndDisplayMatchedData(fetchedData, matchedTableBody) {
      const groupedData = {};

      fetchedData.forEach(item => {
          const key = `${item.date}-${item.time}`;
          if (!groupedData[key]) {
              groupedData[key] = [];
          }
          groupedData[key].push(item);
      });

      Object.keys(groupedData).forEach(key => {
          const group = groupedData[key];
          if (group.length > 1) { // Only consider groups with more than one matching date-time
              const row = document.createElement('tr');
              row.innerHTML = `
                  <td>${formatDate(group[0].date)}</td>
                  <td>${group[0].time}</td>
                  <td>${group[0].feeder}</td>
                  <td>${group[0].MW}</td>
                  <td>${group[1]?.feeder || ''}</td>
                  <td>${group[1]?.MW || ''}</td>
                  <td>${group[2]?.feeder || ''}</td>
                  <td>${group[2]?.MW || ''}</td>
                  <td>${group[3]?.feeder || ''}</td>
                  <td>${group[3]?.MW || ''}</td>
              `;
              matchedTableBody.appendChild(row);
          }
      });
  }
});

</script>
</body>
</html>
