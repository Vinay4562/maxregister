<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Feeder Data Fetch by Date Range</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.4/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.17/jspdf.plugin.autotable.min.js"></script>
  <link rel="stylesheet" href="newdataICTSCSS.css">

</head>
<body>
  <div class="header">
    <div class="header-content">
      <img src="logo_new.png" alt="Logo" width="60px" height="60px">
      <h1>𝐓𝐑𝐀𝐍𝐒𝐌𝐈𝐒𝐒𝐈𝐎𝐍 𝐂𝐎𝐑𝐏𝐎𝐑𝐀𝐓𝐈𝐎𝐍 𝐎𝐅 𝐓𝐄𝐋𝐀𝐍𝐆𝐀𝐍𝐀 𝐋𝐈𝐌𝐈𝐓𝐄𝐃</h1>
    </div>
    <nav class="navbar">
      <ul>
        <li><a href="https://400kvssshankarpally.free.nf/">Home</a></li>
        <li><a href="https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/LCbox_retrieve.html">MRT Schedules</a></li>
      </ul>
    </nav>
  </div>

  <div class="container">
    <h2>Multi-Feeder Max MW Data</h2>
    <form id="dataForm">
      <div class="form-item">
        <label for="voltage">Select Voltage Level:</label>
        <select id="voltage" name="voltage" required>
          <option value="">Select Voltage</option>
          <option value="400KV">400KV</option>
          <option value="220KV">220KV</option>
          <option value="ICTS">ICTS</option>
        </select>
      </div>
      <div class="form-item hidden" id="feeder1Container">
        <label for="feeder1">First Feeder:</label>
        <select id="feeder1" name="feeder1" required>
          <option value="">Select First Feeder</option>
        </select>
      </div>
      <div class="form-item hidden" id="feeder2Container">
        <label for="feeder2">Second Feeder:</label>
        <select id="feeder2" name="feeder2" required>
          <option value="">Select Second Feeder</option>
        </select>
      </div>
      <div class="form-item hidden" id="feeder3Container">
        <label for="feeder3">Third Feeder:</label>
        <select id="feeder3" name="feeder3">
          <option value="">Select Third Feeder</option>
        </select>
      </div>
      <div class="form-item hidden" id="feeder4Container">
        <label for="feeder4">Fourth Feeder:</label>
        <select id="feeder4" name="feederloga4">
          <option value="">Select Fourth Feeder</option>
        </select>
      </div>
      <div class="form-item">
        <label for="fromDate">From Date:</label>
        <input type="date" id="fromDate" name="fromDate" required>
      </div>
      <div class="form-item">
        <label for="toDate">To Date:</label>
        <input type="date" id="toDate" name="toDate" required>
      </div>
      <div class="form-item">
        <input type="submit" value="Get Data">
      </div>
    </form>
  </div>

  <div id="fullScreenSpinner" style="display: none;" aria-live="polite">
    <div class="spinner" aria-label="Loading data"></div>
    <p>Loading data...</p>
  </div>

  <div class="data-container" id="dataContainer">
    <h2 id="tableTitle">Feeder Data</h2>
    <table id="dataTable">
      <thead>
        <tr>
          <th>S.No</th>
          <th>Date</th>
          <th>Time</th>
          <th id="feeder1Header">Feeder 1</th>
          <th>MW</th>
          <th id="feeder2Header">Feeder 2</th>
          <th>MW</th>
          <th id="feeder3Header" class="hidden">Feeder 3</th>
          <th id="feeder3MWHeader" class="hidden">MW</th>
          <th id="feeder4Header" class="hidden">Feeder 4</th>
          <th id="feeder4MWHeader" class="hidden">MW</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="max-mw-section">
      <h2 id="maxMWTitle">Maximum MW Data</h2>
      <table id="maxMWTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Time</th>
            <th id="maxFeeder1Header">Feeder 1</th>
            <th>MW</th>
            <th id="maxFeeder2Header">Feeder 2</th>
            <th>MW</th>
            <th id="maxFeeder3Header" class="hidden">Feeder 3</th>
            <th id="maxFeeder3MWHeader" class="hidden">MW</th>
            <th id="maxFeeder4Header" class="hidden">Feeder 4</th>
            <th id="maxFeeder4MWHeader" class="hidden">MW</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="buttons">
      <button id="downloadPDFButton" disabled>Download as PDF</button>
      <button id="downloadExcelButton" disabled>Download as Excel</button>
      <button id="downloadCSVButton" disabled>Download as CSV</button>
    </div>
  </div>

  <script>

    let allRows = [];
    let maxMWRow = null;
    let currentFeeders = [];

    document.addEventListener('DOMContentLoaded', function() {
      console.log('DOM fully loaded');

      const feederOptions = {
        '400KV': ['400KV MAHESHWARAM-2', '400KV MAHESHWARAM-1', '400KV NARSAPUR-1', '400KV NARSAPUR-2', '400KV KETHIREDDYPALLY-1', '400KV KETHIREDDYPALLY-2', '400KV NIZAMABAD-1', '400KV NIZAMABAD-2'],
        '220KV': ['220KV PARIGI-1', '220KV PARIGI-2', '220KV TANDUR', '220KV GACHIBOWLI-1', '220KV GACHIBOWLI-2', '220KV KETHIREDDYPALLY', '220KV YEDDUMAILARAM-1', '220KV YEDDUMAILARAM-2', '220KV SADASIVAPET-1', '220KV SADASIVAPET-2'],
        'ICTS': ['315MVA ICT-1', '315MVA ICT-2', '315MVA ICT-3', '500MVA ICT-4']
      };

      const voltageSelect = document.getElementById('voltage');
      const feeder1Select = document.getElementById('feeder1');
      const feeder2Select = document.getElementById('feeder2');
      const feeder3Select = document.getElementById('feeder3');
      const feeder4Select = document.getElementById('feeder4');

      voltageSelect.addEventListener('change', function() {
        const voltage = this.value;
        console.log('Voltage selected:', voltage);

        [feeder1Select, feeder2Select, feeder3Select, feeder4Select].forEach(select => {
          select.innerHTML = '<option value="">Select Feeder</option>';
          select.parentElement.classList.add('hidden');
        });

        if (feederOptions[voltage]) {
          const feeders = feederOptions[voltage];
          feeders.forEach(feeder => {
            const option = document.createElement('option');
            option.value = feeder;
            option.textContent = feeder;
            feeder1Select.appendChild(option.cloneNode(true));
            feeder2Select.appendChild(option.cloneNode(true));
            if (voltage === 'ICTS') {
              feeder3Select.appendChild(option.cloneNode(true));
              feeder4Select.appendChild(option);
            }
          });

          document.getElementById('feeder1Container').classList.remove('hidden');
          document.getElementById('feeder2Container').classList.remove('hidden');
          if (voltage === 'ICTS') {
            document.getElementById('feeder3Container').classList.remove('hidden');
            document.getElementById('feeder4Container').classList.remove('hidden');
          }
        }
      });

      const form = document.getElementById('dataForm');
      form.addEventListener('submit', async function(event) {
        event.preventDefault();
        event.stopPropagation();
        console.log('Form submission intercepted');

        const spinner = document.getElementById('fullScreenSpinner');
        spinner.style.display = 'flex';

        const voltage = voltageSelect.value;
        const feeder1 = feeder1Select.value;
        const feeder2 = feeder2Select.value;
        const feeder3 = feeder3Select.value;
        const feeder4 = feeder4Select.value;
        const fromDate = document.getElementById('fromDate').value;
        const toDate = document.getElementById('toDate').value;

        console.log('Form data:', { voltage, feeder1, feeder2, feeder3, feeder4, fromDate, toDate });

        if (!voltage || !feeder1 || !feeder2 || !fromDate || !toDate || (voltage === 'ICTS' && (!feeder3 || !feeder4))) {
          alert('Please fill in all required fields.');
          spinner.style.display = 'none';
          return;
        }

        if (new Date(fromDate) > new Date(toDate)) {
          alert('From Date cannot be later than To Date.');
          spinner.style.display = 'none';
          return;
        }

        if ((voltage === '400KV' || voltage === '220KV') && feeder1 === feeder2) {
          alert('Please select different feeders.');
          spinner.style.display = 'none';
          return;
        } else if (voltage === 'ICTS' && new Set([feeder1, feeder2, feeder3, feeder4]).size !== 4) {
          alert('Please select different feeders for each input.');
          spinner.style.display = 'none';
          return;
        }

        try {
          await fetchAndDisplayData(voltage, feeder1, feeder2, feeder3, feeder4, fromDate, toDate);
          console.log('Data fetched and displayed');
          document.getElementById('downloadPDFButton').disabled = false;
          document.getElementById('downloadExcelButton').disabled = false;
          document.getElementById('downloadCSVButton').disabled = false;
        } catch (error) {
          console.error('Error fetching data:', error);
          alert('Failed to fetch data. Please try again.');
        } finally {
          spinner.style.display = 'none';
        }
      });

      function resetForm() {
        const form = document.getElementById('dataForm');
        form.reset();
        voltageSelect.value = '';
        [feeder1Select, feeder2Select, feeder3Select, feeder4Select].forEach(select => {
          select.innerHTML = '<option value="">Select Feeder</option>';
          select.parentElement.classList.add('hidden');
        });
        console.log('Form reset for new data entry');
      }

      async function fetchDataByDateRange(feeder, fromDate, toDate) {
        try {
          const response = await fetch(
            `https://maxregister-git-main-vinay-kumars-projects-f1559f4a.vercel.app/data-by-date?feeder=${encodeURIComponent(feeder)}&fromDate=${fromDate}&toDate=${toDate}`
          );
          if (!response.ok) {
            throw new Error(`Failed to fetch data: ${response.status} ${response.statusText}`);
          }
          return await response.json();
        } catch (error) {
          console.error(`Error fetching data for ${feeder}:`, error);
          throw error;
        }
      }

      async function fetchAndDisplayData(voltage, feeder1, feeder2, feeder3, feeder4, fromDate, toDate) {
        const feeders = voltage === 'ICTS' ? [feeder1, feeder2, feeder3, feeder4] : [feeder1, feeder2];
        const dataPromises = feeders.map(feeder => fetchDataByDateRange(feeder, fromDate, toDate));
        const allData = await Promise.all(dataPromises);

        console.log('Fetched data:', allData);

        const feederData = {};
        feeders.forEach((feeder, index) => {
          feederData[feeder] = allData[index];
        });

        console.log('Processed feeder data:', feederData);
        displayData(voltage, feederData, fromDate, toDate, feeders);
      }

      function displayData(voltage, feederData, fromDate, toDate, feeders) {
        // Clear previous data
        allRows = [];
        maxMWRow = null;
        currentFeeders = feeders;

        const dataTableBody = document.querySelector('#dataTable tbody');
        const maxMWTableBody = document.querySelector('#maxMWTable tbody');
        const dataContainer = document.getElementById('dataContainer');
        dataTableBody.innerHTML = '';
        maxMWTableBody.innerHTML = '';
        dataContainer.style.display = 'block';

        // Update headers
        document.getElementById('feeder1Header').textContent = feeders[0];
        document.getElementById('feeder2Header').textContent = feeders[1];
        document.getElementById('maxFeeder1Header').textContent = feeders[0];
        document.getElementById('maxFeeder2Header').textContent = feeders[1];
        
        if (voltage === 'ICTS') {
            document.getElementById('feeder3Header').textContent = feeders[2];
            document.getElementById('feeder4Header').textContent = feeders[3];
            document.getElementById('maxFeeder3Header').textContent = feeders[2];
            document.getElementById('maxFeeder4Header').textContent = feeders[3];
            ['feeder3Header', 'feeder3MWHeader', 'feeder4Header', 'feeder4MWHeader', 
            'maxFeeder3Header', 'maxFeeder3MWHeader', 'maxFeeder4Header', 'maxFeeder4MWHeader']
            .forEach(id => document.getElementById(id).classList.remove('hidden'));
        } else {
            ['feeder3Header', 'feeder3MWHeader', 'feeder4Header', 'feeder4MWHeader', 
            'maxFeeder3Header', 'maxFeeder3MWHeader', 'maxFeeder4Header', 'maxFeeder4MWHeader']
            .forEach(id => document.getElementById(id).classList.add('hidden'));
        }

        // Aggregate data by timestamp
        const dataByTimestamp = {};
        feeders.forEach(feeder => {
            feederData[feeder].forEach(item => {
                const key = `${item.date}_${item.time}`;
                if (!dataByTimestamp[key]) {
                    dataByTimestamp[key] = { date: item.date, time: item.time };
                    feeders.forEach(f => dataByTimestamp[key][f] = '-');
                }
                dataByTimestamp[key][feeder] = Math.round(Number(item.MW));
            });
        });

        allRows = Object.values(dataByTimestamp);
        if (allRows.length === 0) {
            dataTableBody.innerHTML = `<tr><td colspan="${voltage === 'ICTS' ? 11 : 7}" style="text-align: center; color: red;">No data found for the selected range.</td></tr>`;
            maxMWTableBody.innerHTML = `<tr><td colspan="${voltage === 'ICTS' ? 10 : 6}" style="text-align: center; color: red;">No data found.</td></tr>`;
            return;
        }

        // Find max MW row across all data
        let maxTotalMW = -Infinity;
        allRows.forEach(row => {
            const totalMW = feeders.reduce((sum, feeder) => {
                const mw = Number(row[feeder]) || 0;
                return sum + mw;
            }, 0);
            row.totalMW = totalMW;
            if (totalMW > maxTotalMW) {
                maxTotalMW = totalMW;
                maxMWRow = row;
            }
        });

        // Sort and display all rows
        allRows.sort((a, b) => {
            const dateA = new Date(a.date + ' ' + a.time);
            const dateB = new Date(b.date + ' ' + b.time);
            return dateA - dateB;
        });

        allRows.forEach((row, index) => {
            const tr = document.createElement('tr');
            const serialNo = index + 1;
            const isMaxMWRow = row === maxMWRow;
            
            if (isMaxMWRow) {
                tr.classList.add('highlight-max-row');
            }

            tr.innerHTML = `
                <td>${serialNo}</td>
                <td>${formatDate(row.date)}</td>
                <td>${row.time}</td>
                <td>${feeders[0]}</td>
                <td>${row[feeders[0]]}</td>
                <td>${feeders[1]}</td>
                <td>${row[feeders[1]]}</td>
                ${voltage === 'ICTS' ? `
                    <td>${feeders[2]}</td>
                    <td>${row[feeders[2]]}</td>
                    <td>${feeders[3]}</td>
                    <td>${row[feeders[3]]}</td>
                ` : ''}
            `;
            dataTableBody.appendChild(tr);
        });

        // Display max MW table
        if (!maxMWRow) {
            maxMWTableBody.innerHTML = `<tr><td colspan="${voltage === 'ICTS' ? 10 : 6}" style="text-align: center; color: red;">No matching records found for max MW.</td></tr>`;
        } else {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${formatDate(maxMWRow.date)}</td>
                <td>${maxMWRow.time}</td>
                <td>${feeders[0]}</td>
                <td>${maxMWRow[feeders[0]]}</td>
                <td>${feeders[1]}</td>
                <td>${maxMWRow[feeders[1]]}</td>
                ${voltage === 'ICTS' ? `
                    <td>${feeders[2]}</td>
                    <td>${maxMWRow[feeders[2]]}</td>
                    <td>${feeders[3]}</td>
                    <td>${maxMWRow[feeders[3]]}</td>
                ` : ''}
            `;
            maxMWTableBody.appendChild(tr);
        }

        // Update table titles
        const fromDateFormatted = formatDate(fromDate);
        const toDateFormatted = formatDate(toDate);
        document.getElementById('tableTitle').textContent = 
            `MAX MW of ${feeders[0]} & ${feeders[1]}${voltage === 'ICTS' ? ` & ${feeders[2]} & ${feeders[3]}` : ''} from ${fromDateFormatted} to ${toDateFormatted}`;
        document.getElementById('maxMWTitle').textContent = 
            `Maximum MW from ${fromDateFormatted} to ${toDateFormatted}`;
    }

        // Update PDF download to maintain highlighting
        document.getElementById('downloadPDFButton').addEventListener('click', function() {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF();
          
          // Add logo and header
          doc.addImage('logo_new.png', 'PNG', 14, 10, 30, 30);
          doc.setFont("helvetica", "bold");
          doc.setFontSize(14);
          doc.text("TRANSMISSION CORPORATION OF TELANGANA LIMITED", 48, 20);
          
          // Get form input values for dynamic title
          const voltage = document.getElementById('voltage').value;
          const feeder1 = document.getElementById('feeder1').value;
          const feeder2 = document.getElementById('feeder2').value;
          const feeder3 = document.getElementById('feeder3').value;
          const feeder4 = document.getElementById('feeder4').value;
          const fromDate = document.getElementById('fromDate').value;
          const toDate = document.getElementById('toDate').value;
          
          // Format dates
          const fromDateFormatted = formatDate(fromDate);
          const toDateFormatted = formatDate(toDate);
          
          // Construct dynamic title
          let feedersText = `${feeder1} & ${feeder2}`;
          if (voltage === 'ICTS') {
              feedersText += ` & ${feeder3} & ${feeder4}`;
          }
          const dynamicTitle = `${feedersText} from ${fromDateFormatted} to ${toDateFormatted}`;
          
          // Calculate page width and center the title
          const pageWidth = doc.internal.pageSize.getWidth(); // Typically 210mm for A4
          doc.setFont("helvetica", "normal");
          doc.setFontSize(10);
          const titleWidth = doc.getTextWidth(dynamicTitle);
          const titleX = (pageWidth - titleWidth) / 2; // Center position
          
          // Set initial table position
          const tableStartY = 35; // Adjusted to be closer to header
          
          // Add centered title immediately above table
          doc.text(dynamicTitle, titleX, tableStartY - 2); // 2 units above table start

          // Create main table
          doc.autoTable({
              html: '#dataTable',
              startY: tableStartY, // Start table right after title
              theme: "grid",
              headStyles: { 
                  fontSize: 10,
                  fillColor: [52, 73, 94], // Match table header color (#34495e)
                  textColor: 255
              },
              bodyStyles: { fontSize: 9 },
              margin: { top: 0 }, // Remove top margin
              didParseCell: function(data) {
                  if (data.section === 'body' && allRows.length > 0) {
                      const rowData = allRows[data.row.index];
                      const isMaxMWRow = rowData === maxMWRow;
                      if (isMaxMWRow) {
                          data.cell.styles.fillColor = [255, 255, 0]; // Yellow
                      }
                  }
              }
          });

          // Add max MW table
          doc.autoTable({
              html: '#maxMWTable',
              startY: doc.lastAutoTable.finalY + 10,
              theme: "grid",
              headStyles: { 
                  fontSize: 10,
                  fillColor: [52, 73, 94],
                  textColor: 255
              },
              bodyStyles: { fontSize: 9 }
          });

          doc.save('multi_feeder_data.pdf');
      });

      function findMatchedRows(voltage, feederData) {
        const feeders = Object.keys(feederData);
        const dataArrays = Object.values(feederData);
        const matchedRows = [];

        if (voltage !== 'ICTS') {
          const [data1, data2] = dataArrays;
          for (const item1 of data1) {
            for (const item2 of data2) {
              if (item1.date === item2.date && item1.time === item2.time) {
                matchedRows.push({ date: item1.date, time: item1.time, [feeders[0]]: item1, [feeders[1]]: item2 });
              }
            }
          }
        } else {
          const [data1, data2, data3, data4] = dataArrays;
          for (const item1 of data1) {
            for (const item2 of data2) {
              if (item1.date === item2.date && item1.time === item2.time) {
                for (const item3 of data3) {
                  if (item1.date === item3.date && item1.time === item3.time) {
                    for (const item4 of data4) {
                      if (item1.date === item4.date && item1.time === item4.time) {
                        matchedRows.push({
                          date: item1.date,
                          time: item1.time,
                          [feeders[0]]: item1,
                          [feeders[1]]: item2,
                          [feeders[2]]: item3,
                          [feeders[3]]: item4
                        });
                      }
                    }
                  }
                }
              }
            }
          }
        }
        return matchedRows;
      }

      function displayMaxMWRow(tableBody, matchedRows, voltage, fromDate, toDate) {
        let maxMW = -Infinity;
        let maxMWRow = null;

        matchedRows.forEach(row => {
          const totalMW = Object.values(row).reduce((sum, item) => 
            item.MW ? sum + Math.round(Number(item.MW)) : sum, 0);
          if (totalMW > maxMW) {
            maxMW = totalMW;
            maxMWRow = row;
          }
        });

        if (maxMWRow) {
          console.log('Max MW row:', maxMWRow);
          const tr = document.createElement('tr');
          const feeders = Object.keys(maxMWRow).filter(key => key !== 'date' && key !== 'time');
          tr.innerHTML = `
            <td>${formatDate(maxMWRow.date)}</td>
            <td>${maxMWRow.time}</td>
            <td>${feeders[0]}</td>
            <td>${Math.round(Number(maxMWRow[feeders[0]].MW))}</td>
            <td>${feeders[1]}</td>
            <td>${Math.round(Number(maxMWRow[feeders[1]].MW))}</td>
            ${voltage === 'ICTS' ? `
              <td>${feeders[2]}</td>
              <td>${Math.round(Number(maxMWRow[feeders[2]].MW))}</td>
              <td>${feeders[3]}</td>
              <td>${Math.round(Number(maxMWRow[feeders[3]].MW))}</td>
            ` : ''}
          `;
          tableBody.appendChild(tr);
          console.log('Max MW table body HTML:', tableBody.innerHTML);
        }
      }

      function formatDate(dateString) {
        const date = new Date(dateString);
        const day = date.getDate().toString().padStart(2, '0');
        const month = (date.getMonth() + 1).toString().padStart(2, '0');
        const year = date.getFullYear();
        return `${day}-${month}-${year}`;
      }
    
      document.getElementById('downloadExcelButton').addEventListener('click', function() {
        const wb = XLSX.utils.book_new();
        const dataSheet = XLSX.utils.table_to_sheet(document.getElementById('dataTable'));
        const maxMWSheet = XLSX.utils.table_to_sheet(document.getElementById('maxMWTable'));
        XLSX.utils.book_append_sheet(wb, dataSheet, 'All Data');
        XLSX.utils.book_append_sheet(wb, maxMWSheet, 'Max MW');
        XLSX.writeFile(wb, 'multi_feeder_data.xlsx');
      });

      document.getElementById('downloadCSVButton').addEventListener('click', function() {
        const dataCSV = XLSX.utils.sheet_to_csv(XLSX.utils.table_to_sheet(document.getElementById('dataTable')));
        const maxMWCSV = XLSX.utils.sheet_to_csv(XLSX.utils.table_to_sheet(document.getElementById('maxMWTable')));
        const csvContent = "data:text/csv;charset=utf-8," + dataCSV + "\n\nMaximum MW Data:\n" + maxMWCSV;
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "multi_feeder_data.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });
    });
  </script>
</body>
</html>
